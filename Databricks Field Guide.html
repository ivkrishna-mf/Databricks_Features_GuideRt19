<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a repo browser. Folder tree on the left, one README-style page on the right. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e9edf1; --ink:#15202b; --muted:#566676; --line:#d5dce3;
  --accent:#0a6a8f; --accent-soft:#dff0f6; --warn:#a8470b; --warn-soft:#fbeadc; --good:#1f7a4d; --good-soft:#dff3e8;
  --code-bg:#101820; --code-ink:#dbe5ee; --code-com:#7f93a6; --code-str:#9fd6a8; --code-key:#7cc4ee;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161f28; --sunken:#1d2832; --ink:#e4ebf1; --muted:#93a3b3; --line:#2a3743;
    --accent:#62c1e6; --accent-soft:#12313f; --warn:#f0a35e; --warn-soft:#3a2413; --good:#6fd09c; --good-soft:#143324;
    --code-bg:#0a1016; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunken:#1d2832; --ink:#e4ebf1; --muted:#93a3b3; --line:#2a3743;
  --accent:#62c1e6; --accent-soft:#12313f; --warn:#f0a35e; --warn-soft:#3a2413; --good:#6fd09c; --good-soft:#143324;
  --code-bg:#0a1016; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px}
.brand b{font:600 20px/1.15 var(--display);letter-spacing:.01em;display:block}
.brand span{color:var(--muted);font-size:13px}
.progress{height:6px;background:var(--sunken);border-radius:3px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
#q{margin:0 16px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:calc(100% - 32px)}
nav{overflow:auto;padding:0 8px 24px;flex:1;min-height:0}
nav details{margin-bottom:2px}
nav summary{cursor:pointer;padding:6px 8px;border-radius:6px;font:500 13px var(--mono);color:var(--muted);list-style:none;display:flex;gap:6px;align-items:center}
nav summary::before{content:"▸";font-size:10px;transition:transform .15s}
nav details[open]>summary::before{transform:rotate(90deg)}
nav summary::-webkit-details-marker{display:none}
nav a{display:flex;gap:8px;align-items:baseline;padding:5px 8px 5px 22px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
nav a.sub{padding-left:38px;font-size:13.5px;color:var(--muted)}
nav a:hover{background:var(--sunken)}
nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
nav a .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);flex:none;transform:translateY(1px)}
nav a.done .dot{background:var(--good);border-color:var(--good)}
nav a .mj{margin-left:auto;font:500 10px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
main{overflow:auto;min-height:0}
.page{max-width:920px;margin:0 auto;padding:28px 28px 80px}
.crumb{font:13px var(--mono);color:var(--muted);word-break:break-all}
h1{font:600 34px/1.12 var(--display);margin:8px 0 10px;text-wrap:balance}
h2{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:30px 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.badge{font:500 12px var(--mono);padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.badge.mj{background:var(--accent-soft);color:var(--accent)}
p{margin:0 0 12px;max-width:68ch}
code{font:.88em var(--mono);background:var(--sunken);padding:1px 5px;border-radius:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{margin:0 0 6px;font:600 14px var(--body)}
.card.yes{border-top:3px solid var(--good)} .card.no{border-top:3px solid var(--warn)}
ul{margin:0;padding-left:18px} li{margin:4px 0}
.senior{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 18px}
.senior p{margin:0;max-width:72ch}
.traps{background:var(--warn-soft);border-radius:8px;padding:12px 16px}
.traps li::marker{color:var(--warn)}
/* flow */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.track{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0}
.node{flex:1 1 130px;min-width:120px;border:1.5px solid var(--line);border-radius:8px;padding:10px 10px;background:var(--bg);cursor:pointer;text-align:left;transition:border-color .25s,background .25s,transform .25s}
.node small{display:block;font:500 11px var(--mono);color:var(--muted)}
.node b{font-weight:600;font-size:14px;line-height:1.25;display:block}
.node.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.edge{flex:0 0 34px;position:relative;align-self:center;height:2px;background:var(--line)}
.edge::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--line)}
.edge i{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0}
.flow.run .edge.live i{animation:hop 1.1s linear infinite;opacity:1}
@keyframes hop{from{left:0}to{left:calc(100% - 8px)}}
.cap{margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.cap p{margin:0;flex:1;min-height:3.1em}
.cap button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion: reduce){.flow.run .edge.live i{animation:none;left:calc(50% - 4px)}.node{transition:none}}
/* code */
.ex{margin-bottom:14px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ex header{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);padding:8px 12px;font-size:14px;font-weight:500}
.ex header span{font:12px var(--mono);color:var(--muted);margin-left:8px;font-weight:400}
.ex header button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;overflow-x:auto;font:13px/1.55 var(--mono);tab-size:4}
pre .c{color:var(--code-com)} pre .s{color:var(--code-str)} pre .k{color:var(--code-key)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--sunken)}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:4px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.foot a,.foot button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;text-decoration:none;color:var(--ink);cursor:pointer;font-size:14px}
.foot button.done{background:var(--good-soft);border-color:var(--good)}
#menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  aside nav,aside #q{display:none} aside.open nav,aside.open #q{display:block} aside.open{max-height:75vh}
  .brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .progress{display:none}
  #menu{display:block;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
  .cols{grid-template-columns:1fr} .page{padding:20px 16px 60px} h1{font-size:27px}
  .edge{flex-basis:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <div><b>Databricks Field Guide</b><span id="count"></span><div class="progress"><i id="pbar"></i></div></div>
      <button id="menu" type="button">Browse</button>
    </div>
    <input id="q" type="search" placeholder="Filter, e.g. scd, lakebase, vector" aria-label="Filter features">
    <nav id="nav" aria-label="Feature tree"></nav>
  </aside>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<script>
const CATS=[];const FEATS=[];
function C(dir,title){CATS.push({dir,title});}
function F(o){o.cat=CATS[CATS.length-1].dir;FEATS.push(o);}
C('00-start-here','Start here');
F({id:'start',title:'How this guide is organized',major:true,
what:["This is a field guide to the whole Databricks platform, organized like a repository: each folder is a major area, each page a feature, and sub-pages sit under the feature they extend. Every page has the same parts: what it is, an animated flow you can step through, when to choose it and when not to, a senior engineer's verdict, two or more runnable examples, and the traps that catch people.",
"Read the major pages in a folder first, then the sub-pages. Examples use Python (PySpark) unless SQL, YAML or shell is the natural tool, and assume Unity Catalog names such as [[main.silver.orders]]. Mark pages as studied to track progress in this browser.",
"Several products were renamed recently. Delta Live Tables is now Lakeflow Spark Declarative Pipelines, APPLY CHANGES is AUTO CDC, Databricks Asset Bundles are Declarative Automation Bundles, Repos are Git folders, Delta Sharing appears as OpenSharing, Lakehouse Monitoring is data profiling, and Genie spaces are Genie Agents."],
table:{title:'Folders',head:['Folder','Covers'],rows:[
['01 Lakehouse core','Delta log, medallion, managed tables, schema evolution, MERGE, clone'],
['02 Ingestion','Auto Loader, COPY INTO, message buses, Lakeflow Connect, federation, sharing'],
['03 Declarative pipelines','SDP, streaming tables and materialized views, expectations, AUTO CDC, flows'],
['04 SCD and change data','SCD types 0 to 6, MERGE patterns, change data feed'],
['05 Structured Streaming','Triggers, checkpoints, watermarks, joins, foreachBatch, transformWithState'],
['06 Data manipulation','Windows and joins, VARIANT, AI functions, UDFs'],
['07 Orchestration and deployment','Jobs, compute, bundles, Git and CI/CD, testing, dependencies'],
['08 Performance and cost','Liquid clustering, deletion vectors, predictive optimization, caching, tuning'],
['09 Governance and security','Unity Catalog, privileges, ABAC, PII, erasure, tags and lineage'],
['10 Monitoring','System tables, event logs, alerts, APIs, data quality monitoring'],
['11 Data modeling','Table layout, dimensional models, metric views'],
['12 Spark engine','Execution model, Databricks Connect, pandas on Spark'],
['13 Delta and Iceberg features','Constraints, identity columns, renames, Iceberg and UniForm'],
['14 Developer tools','Notebooks and dbutils, secrets, SDK, CLI, Terraform'],
['15 Databricks SQL and BI','Warehouses, parameterized SQL and scripting, dashboards, Genie'],
['16 Machine learning and AI','MLflow, models in UC, features, serving, AI Gateway, vector search, agents'],
['17 Apps and Lakebase','Databricks Apps, managed Postgres and synced tables'],
['18 Platform and administration','Identity, storage access, networking, Hive metastore migration, Marketplace']]},
senior:"Learn the platform in the order data flows: land it (ingestion), shape it (pipelines, streaming, SCD), make it fast and cheap (performance), govern it, then serve it (SQL, BI, ML, apps). Run each example in a workspace; the Free Edition is enough for most of them."});
F({id:'exam-blueprint',title:'Certification mapping (Data Engineer Professional)',
what:["If you are preparing for the Data Engineer Professional exam, this page maps its sections to folders. The guide dated 9 Oct 2026 has 60 scored multiple-choice questions in 120 minutes, in Python and SQL. Pages tagged with an exam badge (S1 to S9) carry the matching objectives. Questions are scenario-based, so the 'when to choose' and 'traps' blocks matter more than syntax."],
table:{title:'Sections, weights and where to study',head:['Section','Weight','Folders'],rows:[
['1. Developing code for data processing (Python, SQL)',23,'03, 05, 07'],
['2. Data ingestion and acquisition',12,'02'],
['3. Data manipulation',12,'06, expectations'],
['4. Monitoring and alerting',10,'10'],
['5. Cost and performance optimization',15,'08, change data feed'],
['6. Data security and compliance',8,'09'],
['7. Data governance',5,'09'],
['8. Debugging and deploying',10,'07, 08'],
['9. Data modeling',5,'11']]},
senior:"Re-read the official exam guide two weeks before your date, because Databricks revises it. Do every example on the exam-badged pages yourself and be able to say why each wrong option is wrong."});
F({id:'feature-timeline',title:'Databricks features from the beginning to now',major:true,
what:["The platform grew in layers. Each layer fixed a pain in the one before it, and knowing the order tells you which feature is the current recommendation and which is legacy. Years are approximate; check the docs when an exact GA date matters."],
flow:[['Managed Spark','2013 onward. Notebooks, clusters and jobs around Apache Spark. Problem left open: data lakes had no transactions.'],
['Delta Lake','2017 to 2019. ACID log on Parquet, time travel, MERGE. Problem left open: getting files in incrementally and governing them.'],
['Auto Loader, DLT, Photon','2020 to 2022. Incremental file ingestion, declarative pipelines, a vectorized engine, Databricks SQL.'],
['Unity Catalog','2021 to 2023. One governance layer: catalogs, lineage, sharing, system tables, federation.'],
['Serverless and Lakeflow','2024 to 2025. Serverless compute, liquid clustering, predictive optimization, VARIANT, Lakeflow Connect, Pipelines and Jobs.'],
['AI and apps','2023 to 2025. MLflow and models in Unity Catalog, Model Serving, Vector Search, Genie, Apps, Lakebase, agents.'],
['Runtime 19 era','2026. Declarative Automation Bundles, AUTO CDC, automatic change data feed, ABAC, metric views, Lakebase GA.']],
table:{title:'Timeline',head:['When','What shipped','Why it matters today'],rows:[
['2013','Databricks founded by the creators of Apache Spark; notebooks, clusters, jobs','Still the base: everything runs on Spark'],
['2016 to 2017','Structured Streaming; Delta announced','Streaming and batch share one DataFrame API'],
['2018','MLflow open sourced','Experiment tracking and model packaging used across the industry'],
['2019','Delta Lake open sourced','Transaction log, time travel, schema enforcement'],
['2020','Auto Loader; lakehouse architecture; Databricks SQL; Photon announced','Incremental file ingestion with [[cloudFiles]]'],
['2021','Delta Live Tables, Unity Catalog and Delta Sharing announced','Declarative pipelines and central governance begin'],
['2022','DLT, Unity Catalog, Photon and Delta Sharing reach GA; multi-task jobs','Medallion pipelines with expectations become standard'],
['2023','Deletion vectors, liquid clustering preview, predictive optimization, system tables, Lakehouse Federation, UniForm, bundles preview; MosaicML acquired; Model Serving and Vector Search','Low-maintenance tables and the start of Mosaic AI'],
['2024','Bundles GA, liquid clustering GA, serverless jobs and notebooks, VARIANT, Clean Rooms, Lakeflow announced; AI/BI dashboards and Genie; Databricks Apps preview; Agent Framework','Serverless-first; BI, apps and agents on the same platform'],
['2025','Lakeflow GA (Connect, Declarative Pipelines, Jobs); DLT renamed; Spark Declarative Pipelines contributed to Apache Spark; AUTO CDC replaces APPLY CHANGES; real-time mode; metric views; ABAC; Lakebase (managed Postgres) and Agent Bricks announced; Apps GA; MLflow 3','Operational databases and agents join the platform'],
['2026','Bundles renamed Declarative Automation Bundles (March); Runtime 19 with automatic change data feed; OpenSharing name; Lakebase GA across clouds; data quality monitoring; Genie Agents','What this guide targets']]},
senior:"When two features overlap, the newer one is nearly always the expected answer: liquid clustering over partitioning plus ZORDER, AUTO CDC over hand-written MERGE inside pipelines, file events over directory listing, Unity Catalog over the Hive metastore, serverless over hand-tuned clusters. The older option wins only when the scenario gives a concrete reason."});
F({id:'runtime-19',title:'What is new in Runtime 19',since:'DBR 19',
what:["Runtime 19 is built on Apache Spark 4.x with Java 21, Scala 2.13 and Python 3.12. The exam guide does not name a runtime version, so treat this page as context for your project and for spotting behavior changes, not as a list of exam objectives."],
table:{title:'Changes a data engineer will notice',head:['Area','Change','What to do'],rows:[
['Delta','Automatic change data feed: row-level changes computed at query time from row tracking','You no longer need [[delta.enableChangeDataFeed]] on every table; row tracking must be on'],
['Delta','[[INSERT INTO ... REPLACE ON / USING]] and [[withSchemaEvolution()]] on the DataFrame writer','Simpler upsert-style and evolving writes'],
['Python','Arrow-optimized Python UDFs are on by default','Faster UDFs; type coercion can differ, config exists to revert'],
['Python','About 90 packages removed from the base image (plotly, seaborn, pyodbc, psycopg2 and others)','Declare them explicitly in the environment or cluster libraries'],
['Java','JDK 17 fallback removed','Unset [[JNAME]] if a cluster pins zulu17'],
['Streaming','Kinesis polling in real-time mode GA; watermark boundary records retained','Re-check tests that assert on exact late-data counts'],
['SQL','[[SET PATH]] and [[CURRENT_PATH()]]; new functions such as [[trim_array]], [[variant_strip_nulls]]','Shorter function references across schemas'],
['Governance','Atomic [[CREATE OR REPLACE VIEW]] keeps grants and tags; policy details hidden in plans; stricter Spark configs in standard access mode','Remove blocked configs such as [[spark.jars]] from shared clusters'],
['Shuffle','Auto-optimized shuffle is the default when no fixed partition count is set','Stop hard-coding [[spark.sql.shuffle.partitions]] unless you measured']]},
flow:[['Inventory','List jobs and the packages and Spark configs they rely on.'],['Test on 19','Run the test suite on a Runtime 19 job cluster or the matching serverless environment.'],['Fix dependencies','Declare removed packages; drop blocked configs and the JDK 17 pin.'],['Compare output','Check UDF results and late-data counts against the old runtime.'],['Roll out','Switch targets in the bundle, dev first, then prod.']],
senior:"The upgrade risk is not Spark, it is the removed Python packages and the Arrow UDF default. Run your test suite on a Runtime 19 job cluster before switching production, and pin dependencies in the bundle rather than relying on what the image happens to include.",
ex:[{t:'Read row-level changes without enabling CDF per table',code:`
# Runtime 19+: row tracking on, changes are computed at query time
spark.sql("ALTER TABLE main.silver.orders SET TBLPROPERTIES ('delta.enableRowTracking' = 'true')")

changes = (spark.read
    .option("readChangeFeed", "true")
    .option("startingVersion", 120)
    .table("main.silver.orders"))
changes.groupBy("_change_type").count().show()`},
{t:'Declare packages that Runtime 19 no longer ships',lang:'yaml',code:`
# resources/job.yml (serverless environment for a job task)
environments:
  - environment_key: default
    spec:
      environment_version: "4"     # use the version your workspace offers
      dependencies:
        - plotly==5.24.1
        - psycopg2-binary==2.9.10
        - ./dist/*.whl`}],
traps:["A question that says 'the notebook worked on Runtime 18 and fails with ModuleNotFoundError on 19' is about removed packages, not about a broken cluster.","Automatic change data feed needs row tracking. Without it you still need the table property."]});

C('01-lakehouse-core','Lakehouse core');
F({id:'delta-lake-log',title:'Delta Lake transaction log',major:true,exam:'S5, S9',
what:["A Delta table is Parquet files plus a [[_delta_log]] folder of ordered JSON commits. Each commit lists files added and removed, so readers see a consistent snapshot and writers get ACID transactions through optimistic concurrency.",
"Because old files stay until VACUUM removes them, you can query earlier versions (time travel) and roll back with RESTORE."],
flow:[['Writer stages files','New Parquet files are written. Nothing is visible yet.'],
['Commit N.json','The writer tries to create the next numbered commit. If another writer got there first, Delta checks for a real conflict and retries.'],
['Checkpoint','Periodically the log state is compacted into a Parquet checkpoint so readers do not replay every commit.'],
['Reader snapshot','A reader loads the latest checkpoint plus later commits and reads only the files in that snapshot.'],
['Time travel and VACUUM','Old versions stay queryable until log and file retention expire and VACUUM deletes unreferenced files.']],
when:["Always. Every table in Unity Catalog should be Delta, or Iceberg where an external engine requires it.","You need concurrent writers, upserts, deletes, or an audit trail of changes."],
avoid:["You plan to keep years of history through time travel. Retention defaults are 30 days of log and 7 days of removed files; use an SCD2 table for long history."],
senior:"I treat time travel as an operational undo, not as a history store. The two properties people confuse are [[delta.logRetentionDuration]] (how far back versions are listed) and [[delta.deletedFileRetentionDuration]] (how long the data files survive). You need both to travel back.",
ex:[{t:'History, time travel and restore',code:`
df.write.mode("append").saveAsTable("main.sales.orders")

(spark.sql("DESCRIBE HISTORY main.sales.orders")
    .select("version", "timestamp", "operation", "operationMetrics")
    .show(5, truncate=False))

before = spark.read.option("versionAsOf", 12).table("main.sales.orders")
spark.sql("RESTORE TABLE main.sales.orders TO VERSION AS OF 12")`},
{t:'Idempotent append that survives a retry',code:`
# Same (txnAppId, txnVersion) is written once, even if the task reruns
(df.write.format("delta").mode("append")
    .option("txnAppId", "orders_loader")
    .option("txnVersion", run_number)       # monotonically increasing per app
    .saveAsTable("main.sales.orders"))`}],
traps:["RESTORE fails if VACUUM already removed the files of the target version.","Default isolation is WriteSerializable. Two appends never conflict; two MERGE or UPDATE statements touching the same files can.","Time travel beyond the retention window is not guaranteed even if the version still shows in history."]});
F({id:'medallion',title:'Medallion architecture',exam:'S1, S9',
what:["A layering convention. Bronze keeps raw data as it arrived, silver holds cleaned and conformed records, gold holds business-level aggregates and dimensional models. Each layer is a set of Delta tables."],
flow:[['Sources','Files, message buses, databases, SaaS.'],['Bronze','Append-only, raw, with ingestion metadata. Replayable.'],['Silver','Deduplicated, typed, validated, CDC applied. One row per business entity or event.'],['Gold','Aggregates, dimensions and facts for BI and ML.'],['Consumers','Dashboards, metric views, sharing, models.']],
when:["You want to reprocess after a bug without going back to the source.","Different teams need different trust levels of the same data."],
avoid:["A tiny one-off dataset. Three copies add cost with no gain."],
senior:"Keep bronze dumb. The moment you filter or cast in bronze, you lose the ability to replay. I add [[_metadata.file_path]], an ingest timestamp and the rescued data column, and nothing else.",
ex:[{t:'Bronze: raw plus metadata',code:`
from pyspark.sql import functions as F
bronze = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/orders_schema")
    .load("/Volumes/main/landing/orders/")
    .select("*", F.col("_metadata.file_path").alias("src_file"),
            F.current_timestamp().alias("ingested_at")))`},
{t:'Silver: type, validate, deduplicate',code:`
silver = (spark.readStream.table("main.bronze.orders")
    .withColumn("order_ts", F.to_timestamp("order_ts"))
    .where("order_id IS NOT NULL")
    .withWatermark("order_ts", "1 hour")
    .dropDuplicatesWithinWatermark(["order_id"]))
(silver.writeStream.option("checkpointLocation", "/Volumes/main/ops/chk/orders_silver")
    .trigger(availableNow=True).toTable("main.silver.orders"))`}],
traps:["Bronze is append-only. Applying updates there breaks downstream streaming reads unless they set [[skipChangeCommits]]."]});
F({id:'managed-vs-external',title:'Managed and external tables',exam:'S5, S7',
what:["A managed table lets Unity Catalog own the storage path and lifecycle. An external table points at a path you manage through an external location. Managed tables get predictive optimization, automatic statistics and faster metadata by default."],
flow:[['CREATE TABLE','No LOCATION clause means managed.'],['UC picks storage','Files go under the managed location of the schema, catalog or metastore.'],['Automatic upkeep','Predictive optimization runs OPTIMIZE, VACUUM and ANALYZE.'],['DROP TABLE','Managed data is deleted after the UNDROP window. External files stay.']],
when:["Default for every new table.","You want maintenance handled for you and lower cost over time."],
avoid:["Another system must write to the same path directly.","A hard requirement to keep files after the table is dropped."],
senior:"External tables are for interoperability, not for feeling safe. If a non-Databricks writer needs the data, I would rather share it through Iceberg reads or sharing than give up managed table features.",
ex:[{t:'Managed table with automatic clustering',code:`
spark.sql("""
CREATE TABLE main.silver.events (
  event_id STRING, user_id STRING, event_ts TIMESTAMP, payload VARIANT)
CLUSTER BY AUTO""")`},
{t:'External table on an external location',code:`
spark.sql("""
CREATE TABLE main.raw.partner_feed (id STRING, body STRING)
LOCATION 's3://partner-bucket/feed/'""")
# Dropping it removes metadata only; files remain in the bucket
spark.sql("DROP TABLE main.raw.partner_feed")`}],
traps:["Predictive optimization and [[CLUSTER BY AUTO]] need Unity Catalog managed tables.","Dropping a managed table removes data; UNDROP works for a limited window (7 days by default)."]});
F({id:'schema-evolution',title:'Schema enforcement and evolution',exam:'S1, S2',
what:["Delta rejects writes whose columns or types do not match the table. Evolution is opt-in: [[mergeSchema]] adds new columns on append, [[overwriteSchema]] replaces the schema on overwrite, and MERGE can evolve with [[WITH SCHEMA EVOLUTION]] or [[withSchemaEvolution()]]."],
flow:[['Incoming DataFrame','Has a new column [[coupon]].'],['Enforcement check','Without an option the write fails with a schema mismatch.'],['Evolution option','[[mergeSchema]] tells Delta to add the column.'],['New commit','Metadata action records the new schema; old rows read the column as null.']],
when:["Sources add columns over time and you want pipelines to keep running.","You want bad writes to fail loudly by default."],
avoid:["Type changes that are not widening, such as string to int. Those need an explicit rewrite."],
senior:"I enable evolution in bronze and silver ingestion and keep gold strict. A silently added column in a gold table is a contract change that someone should review.",
ex:[{t:'Add new columns on append',code:`
(new_df.write.mode("append")
    .option("mergeSchema", "true")
    .saveAsTable("main.silver.orders"))`},
{t:'MERGE that evolves the target schema',code:`
from delta.tables import DeltaTable
(DeltaTable.forName(spark, "main.silver.customers").alias("t")
    .merge(updates.alias("s"), "t.customer_id = s.customer_id")
    .withSchemaEvolution()
    .whenMatchedUpdateAll()
    .whenNotMatchedInsertAll()
    .execute())`}],
traps:["[[mergeSchema]] adds columns; it does not drop or rename them. Renames need column mapping.","[[overwriteSchema]] only applies with mode overwrite."]});
F({id:'merge-into',title:'MERGE INTO',exam:'S1, S3',
what:["One atomic statement that inserts, updates and deletes target rows based on a join with a source. It is the base for upserts, deduplicated loads and hand-written SCD logic."],
flow:[['Source batch','New and changed rows, deduplicated to one row per key.'],['Join on keys','Delta finds target files that may hold matching keys.'],['Apply clauses','WHEN MATCHED update or delete, WHEN NOT MATCHED insert, WHEN NOT MATCHED BY SOURCE for rows missing from the source.'],['Rewrite or mark','Touched files are rewritten, or rows are marked with deletion vectors.'],['Single commit','Readers see all changes at once.']],
when:["Batch or foreachBatch upserts outside a declarative pipeline.","You need custom match logic that AUTO CDC cannot express."],
avoid:["Inside Lakeflow pipelines for CDC feeds: use AUTO CDC, which handles ordering and late events."],
senior:"Nine out of ten MERGE incidents are duplicate keys in the source. I deduplicate with a window on the sequencing column before every MERGE, and I add a selective predicate on the target (a date range or clustering key) so Delta does not scan the whole table.",
ex:[{t:'Upsert with a deduplicated source',code:`
from pyspark.sql import functions as F, Window
from delta.tables import DeltaTable
w = Window.partitionBy("customer_id").orderBy(F.col("updated_at").desc())
latest = updates.withColumn("rn", F.row_number().over(w)).where("rn = 1").drop("rn")

(DeltaTable.forName(spark, "main.silver.customers").alias("t")
    .merge(latest.alias("s"), "t.customer_id = s.customer_id")
    .whenMatchedUpdateAll(condition="s.updated_at > t.updated_at")
    .whenNotMatchedInsertAll()
    .execute())`},
{t:'Delete target rows that left the source',code:`
spark.sql("""
MERGE INTO main.silver.products t
USING main.staging.products_snapshot s ON t.sku = s.sku
WHEN MATCHED THEN UPDATE SET *
WHEN NOT MATCHED THEN INSERT *
WHEN NOT MATCHED BY SOURCE THEN DELETE""")`}],
traps:["Multiple source rows matching one target row makes MERGE fail. Deduplicate first.","A table changed by MERGE is no longer append-only, so a stream reading it needs [[skipChangeCommits]] or the change feed."]});
F({id:'clone',title:'Deep and shallow clone',exam:'S8',
what:["A deep clone copies data and metadata into an independent table. A shallow clone copies only metadata and points at the source files, so it is instant and cheap."],
flow:[['Source table','At a chosen version.'],['CLONE','Shallow copies the log; deep also copies data files incrementally.'],['Independent log','Writes to the clone never touch the source.'],['Use','Test a risky change, or keep a backup or archive copy.']],
when:["Shallow: test a migration or a MERGE against production-shaped data.","Deep: backup, archive, or move a table between catalogs."],
avoid:["Shallow clones as long-term copies. They depend on source files that maintenance may remove."],
senior:"Shallow clone is my staging environment for table changes. Clone, run the change, compare, drop. It costs almost nothing.",
ex:[{t:'Shallow clone for a test run',code:`
spark.sql("""
CREATE OR REPLACE TABLE dev.sandbox.orders_test
SHALLOW CLONE main.silver.orders VERSION AS OF 230""")`},
{t:'Deep clone as an incremental backup',code:`
# Rerunning copies only files added since the last run
spark.sql("CREATE OR REPLACE TABLE backup.silver.orders DEEP CLONE main.silver.orders")`}],
traps:["A clone has its own history starting at version 0; it does not carry the source time travel history.","Deep clone reruns are incremental."]});

C('02-ingestion','Ingestion');
F({id:'ingestion-decision',title:'Which ingestion method to choose',major:true,exam:'S2',
what:["Ingestion questions are selection questions. Start from the source type, then latency, then how much infrastructure you are willing to own."],
flow:[['What is the source?','Files, a message bus, an operational database, a SaaS app, or another lakehouse.'],['Is a managed connector available?','For databases and SaaS, Lakeflow Connect comes first.'],['Files: how many, how often?','Auto Loader for anything continuous or large; COPY INTO for small scheduled SQL loads.'],['Do you need the data copied at all?','If not, federate or share instead of ingesting.'],['Land in bronze','A streaming table or Delta table governed by Unity Catalog.']],
table:{title:'Decision table',head:['Source and need','Choose','Why'],rows:[
['Files in cloud storage, arriving continuously or in large numbers','Auto Loader, inside a pipeline or Structured Streaming','Incremental discovery, exactly-once, schema inference and evolution'],
['A few thousand files, SQL-only team, scheduled loads','[[COPY INTO]]','Idempotent and simple; no stream to operate'],
['Kafka, Kinesis, Pub/Sub, Event Hubs','Structured Streaming source or a pipeline streaming table','Offsets tracked in the checkpoint'],
['SQL Server, MySQL, PostgreSQL changes','Lakeflow Connect database connector','Managed gateway captures CDC; no custom log readers'],
['Salesforce, Workday, ServiceNow and similar','Lakeflow Connect SaaS connector','Managed API paging, incremental cursors, schema evolution'],
['Occasional queries on an external database, no copy wanted','Lakehouse Federation','Query in place with pushdown and UC governance'],
['Data owned by another organization or metastore','OpenSharing (Delta Sharing)','Live read access with no copy'],
['Full snapshots only, no change feed','AUTO CDC FROM SNAPSHOT','Diffs snapshots into SCD1 or SCD2'],
['One-time historical load','[[spark.read]] then write, or COPY INTO','No state needed']]},
senior:"I ask three questions in this order: can a managed connector do it, can a declarative pipeline do it, and only then do I write Structured Streaming by hand. Every step down that list is more code I have to operate at 3 a.m.",
traps:["Federation is for querying, not for high-volume ETL. If the scenario mentions heavy joins or dashboards with strict latency, ingest instead.","COPY INTO and Auto Loader are both idempotent. The difference is scale, schema evolution and file discovery cost."]});
F({id:'auto-loader',title:'Auto Loader',major:true,exam:'S1, S2',
what:["Auto Loader is the [[cloudFiles]] Structured Streaming source. It discovers new files in cloud storage, records each one in RocksDB inside the checkpoint so it is processed exactly once, and infers and evolves the schema.",
"It reads JSON, CSV, Parquet, Avro, ORC, text, XML and binary files, and works the same in a notebook stream and in a Lakeflow pipeline."],
flow:[['Files land','A producer drops files into a storage path or volume.'],['Discovery','Directory listing, or file notifications through file events.'],['Checkpoint state','Each discovered file is recorded. A restart resumes without reprocessing.'],['Schema location','Inferred schema is stored and versioned; new columns are handled by the evolution mode.'],['Bronze table','Rows are appended to a Delta or streaming table.']],
when:["Files arrive over time and you must not reload or miss any.","The schema is unknown or drifts.","Directories hold many thousands to billions of files."],
avoid:["A single static load: plain [[spark.read]] is enough.","The source is a queue or a database: use the matching connector."],
senior:"Auto Loader is my default for files, run with [[availableNow]] on a schedule unless the business needs minutes. Three options carry most of the weight: [[cloudFiles.schemaLocation]], the schema evolution mode and the file detection mode. Inside a pipeline the checkpoint and schema location are managed for you, which is one more reason to prefer pipelines.",
ex:[{t:'Incremental JSON ingestion as a scheduled batch',code:`
(spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/orders/_schema")
    .option("cloudFiles.inferColumnTypes", "true")
    .load("/Volumes/main/landing/orders/")
  .writeStream
    .option("checkpointLocation", "/Volumes/main/ops/chk/orders")
    .option("mergeSchema", "true")
    .trigger(availableNow=True)
    .toTable("main.bronze.orders"))`},
{t:'The same source inside a Lakeflow pipeline',code:`
from pyspark import pipelines as dp
from pyspark.sql import functions as F

@dp.table(name="bronze_orders", comment="Raw orders from landing")
def bronze_orders():
    return (spark.readStream.format("cloudFiles")
        .option("cloudFiles.format", "csv")
        .option("header", "true")
        .option("cloudFiles.schemaHints", "amount DECIMAL(18,2), order_ts TIMESTAMP")
        .load("/Volumes/main/landing/orders_csv/")
        .withColumn("src_file", F.col("_metadata.file_path")))`}],
traps:["Without [[cloudFiles.inferColumnTypes]], JSON and CSV columns are inferred as strings.","Deleting the checkpoint makes Auto Loader reprocess every file.","Auto Loader does not guarantee file processing order."]});
F({id:'file-detection-modes',parent:'auto-loader',title:'File detection modes',exam:'S2',
what:["Auto Loader finds new files in one of three ways. Directory listing lists the input path. Classic file notification creates a queue and subscription per stream. File events uses one managed queue per Unity Catalog external location and is the current recommendation."],
flow:[['File created','Object storage records the new object.'],['Storage event','With file events enabled, the event goes to a queue managed for the external location.'],['File events cache','Databricks keeps recent file metadata for all streams on that location.'],['Auto Loader reads cache','The stream asks for files after its stored position. No listing.'],['Periodic full listing','Databricks lists the location on a schedule to catch anything missed.']],
table:{title:'Choosing a mode',head:['Mode','How to enable','Choose when','Watch out'],rows:[
['Directory listing (default)','Nothing','Small directories, quick start, no cloud permissions for queues','Listing cost and latency grow with file count; incremental listing is deprecated'],
['File notification, classic','[[cloudFiles.useNotifications]] = true','Legacy setups, or very low latency directly from the queue','One queue per stream; cloud limits on notifications per bucket; needs elevated cloud permissions'],
['File notification with file events','Enable file events on the external location, then [[cloudFiles.useManagedFileEvents]] = true','Most workloads on Unity Catalog; many streams on one bucket','Runtime 14.3 LTS or above; run the stream at least once every 7 days or it falls back to a full listing']]},
senior:"On Unity Catalog I enable file events on the external location once and every stream benefits. I keep directory listing only for small landing folders where a queue is not worth a conversation with the cloud team. You can switch modes between restarts and keep exactly-once.",
ex:[{t:'File events mode',code:`
df = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "parquet")
    .option("cloudFiles.useManagedFileEvents", "true")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/iot/_schema")
    .load("s3://acme-landing/iot/"))       # path under a UC external location`},
{t:'Classic notification mode with rate limits',code:`
df = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.useNotifications", "true")
    .option("cloudFiles.maxFilesPerTrigger", 500)
    .option("cloudFiles.maxBytesPerTrigger", "10g")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/clicks/_schema")
    .load("abfss://landing@acme.dfs.core.windows.net/clicks/"))`}],
traps:["Changing the input path is supported in directory listing mode, not in file notification mode.","'Millions of files and listing is slow or expensive' points to file notifications with file events.","Neither mode guarantees ordering."]});
F({id:'auto-loader-schema',parent:'auto-loader',title:'Schema inference, evolution and rescued data',exam:'S1, S2',
what:["Auto Loader samples files to infer a schema and stores it at the schema location. When new columns appear, [[cloudFiles.schemaEvolutionMode]] decides what happens. Data that does not fit the schema goes to the [[_rescued_data]] column instead of being lost."],
flow:[['New column appears','A file contains [[discount_code]].'],['Mode check','addNewColumns: the stream stops with an unknown field error after updating the stored schema.'],['Restart','The job retry starts the stream with the new schema.'],['Write','With [[mergeSchema]] on the sink, the Delta table gains the column.']],
table:{title:'Evolution modes',head:['Mode','Behavior on a new column','Choose when'],rows:[
['[[addNewColumns]] (default with no schema given)','Stream fails once, schema is updated, restart continues','You want new fields automatically; set job retries'],
['[[rescue]]','Schema never changes; new fields go to [[_rescued_data]]','Stable contract, but nothing may be lost'],
['[[failOnNewColumns]]','Stream fails until you update the schema or hints','Strict contracts where a human must approve changes'],
['[[none]] (default when you supply a schema)','New columns are ignored','You only want the declared columns']]},
senior:"For bronze I run addNewColumns with job retries, plus schema hints for the columns whose types I care about. When the payload is truly unpredictable I stop fighting it and load the whole record into one VARIANT column.",
ex:[{t:'Rescue mode with type hints',code:`
df = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/pay/_schema")
    .option("cloudFiles.schemaEvolutionMode", "rescue")
    .option("cloudFiles.schemaHints", "amount DECIMAL(18,2), paid_at TIMESTAMP")
    .load("/Volumes/main/landing/payments/"))
bad = df.where("_rescued_data IS NOT NULL")     # route these to a quarantine table`},
{t:'Whole record as VARIANT',code:`
df = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("singleVariantColumn", "payload")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/events/_schema")
    .load("/Volumes/main/landing/events/"))
typed = df.selectExpr("payload:user.id::string AS user_id", "payload:ts::timestamp AS ts")`}],
traps:["With addNewColumns the first failure is expected behavior. The fix is a retry policy, not a different mode.","Type mismatches go to rescued data; they do not evolve the column type."]});
F({id:'auto-loader-operations',parent:'auto-loader',title:'Triggers, backfills and cleanup',exam:'S1, S5',
what:["How you run Auto Loader decides its cost. [[availableNow]] processes everything pending in rate-limited micro-batches and then stops, which gives batch cost with streaming guarantees. A processing-time trigger keeps the stream running."],
flow:[['Schedule fires','A job starts the stream.'],['availableNow','All files discovered so far are processed in several micro-batches.'],['Checkpoint commit','Each batch commits offsets and file state.'],['Stream stops','Compute shuts down until the next run.']],
when:["availableNow: hourly or daily freshness is fine.","Processing-time or continuous pipeline: you need minutes or less."],
avoid:["[[Trigger.Once]]: deprecated and ignores rate limits."],
senior:"Most 'streaming' pipelines I review should be availableNow on a schedule. You keep exactly-once and schema evolution and pay for minutes, not for an always-on cluster.",
ex:[{t:'Scheduled incremental run with file archiving',code:`
(spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/logs/_schema")
    .option("cloudFiles.cleanSource", "MOVE")
    .option("cloudFiles.cleanSource.moveDestination", "s3://acme-archive/logs/")
    .load("s3://acme-landing/logs/")
  .writeStream.option("checkpointLocation", "/Volumes/main/ops/chk/logs")
    .trigger(availableNow=True).toTable("main.bronze.logs"))`},
{t:'Skip history, pick up only new files',code:`
df = (spark.readStream.format("cloudFiles")
    .option("cloudFiles.format", "parquet")
    .option("cloudFiles.includeExistingFiles", "false")
    .option("cloudFiles.backfillInterval", "1 day")     # classic notification safety net
    .option("cloudFiles.schemaLocation", "/Volumes/main/ops/chk/tx/_schema")
    .load("s3://acme-landing/tx/"))`}],
traps:["[[includeExistingFiles]] is read only on the first start of a stream.","A file overwritten in place is not reprocessed unless [[cloudFiles.allowOverwrites]] is true."]});
F({id:'copy-into',title:'COPY INTO',exam:'S2',
what:["A SQL command that loads files from a path into a Delta table and remembers which files it already loaded, so rerunning it is safe."],
flow:[['Files in a path','Thousands, not millions.'],['COPY INTO runs','On a schedule from a SQL warehouse or job.'],['Skip loaded files','File load history lives in the table metadata.'],['Append','New rows land in the target table.']],
when:["SQL-first teams loading modest file counts on a schedule.","Ad hoc or one-off loads that should be re-runnable."],
avoid:["Millions of files, complex nested data or schema drift: Auto Loader handles these better."],
senior:"COPY INTO is fine where it already works. For anything new I reach for a streaming table with [[read_files]] or Auto Loader, because it scales further and I do not have to migrate later.",
ex:[{t:'Idempotent load with schema evolution',code:`
spark.sql("""
COPY INTO main.bronze.invoices
FROM '/Volumes/main/landing/invoices/'
FILEFORMAT = CSV
FORMAT_OPTIONS ('header' = 'true', 'inferSchema' = 'true')
COPY_OPTIONS ('mergeSchema' = 'true')""")`},
{t:'Force a reload of all files',code:`
spark.sql("""
COPY INTO main.bronze.invoices
FROM '/Volumes/main/landing/invoices/'
FILEFORMAT = CSV
FORMAT_OPTIONS ('header' = 'true')
COPY_OPTIONS ('force' = 'true')""")      # ignores load history: duplicates possible`}],
traps:["[[force]] = true disables idempotency.","COPY INTO is batch only; there is no trigger or checkpoint."]});
F({id:'message-buses',title:'Kafka, Kinesis and Pub/Sub',exam:'S2',
what:["Structured Streaming reads message buses with offsets stored in the checkpoint. The payload arrives as binary [[key]] and [[value]] columns that you decode yourself."],
flow:[['Producers','Write events to a topic.'],['Streaming source','Reads from the offsets recorded in the checkpoint.'],['Decode','Cast value to string, then [[from_json]], [[from_avro]] or [[parse_json]].'],['Bronze','Append with topic, partition, offset and timestamp for replay.']],
when:["Event data with latency needs of seconds to minutes.","Decoupling producers from the lakehouse."],
avoid:["The retention of the topic is shorter than your worst outage. Land raw events in bronze first."],
senior:"I always persist the raw bytes and Kafka metadata in bronze before parsing. Topics expire; a bronze table lets me fix a parsing bug and replay. Rate-limit with [[maxOffsetsPerTrigger]] so a backlog does not blow up one micro-batch.",
ex:[{t:'Kafka to bronze',code:`
raw = (spark.readStream.format("kafka")
    .option("kafka.bootstrap.servers", brokers)
    .option("subscribe", "orders")
    .option("startingOffsets", "earliest")
    .option("maxOffsetsPerTrigger", 200000)
    .load())
(raw.selectExpr("CAST(key AS STRING) k", "CAST(value AS STRING) v",
                "topic", "partition", "offset", "timestamp")
    .writeStream.option("checkpointLocation", "/Volumes/main/ops/chk/kafka_orders")
    .toTable("main.bronze.orders_events"))`},
{t:'Kinesis in a pipeline, parsed to VARIANT',code:`
from pyspark import pipelines as dp
from pyspark.sql import functions as F

@dp.table(name="bronze_clicks")
def bronze_clicks():
    return (spark.readStream.format("kinesis")
        .option("streamName", "clicks")
        .option("initialPosition", "TRIM_HORIZON")
        .load()
        .select(F.parse_json(F.col("data").cast("string")).alias("payload"),
                "approximateArrivalTimestamp"))`}],
traps:["[[startingOffsets]] is used only when the checkpoint is new.","A pipeline full refresh re-reads the topic. If retention has passed, that data is gone."]});
F({id:'lakeflow-connect',title:'Lakeflow Connect',major:true,exam:'S2',
what:["Managed connectors that ingest from SaaS applications and operational databases into streaming tables. For SQL Server, MySQL and PostgreSQL, an ingestion gateway reads the change log of the source and stages changes in a Unity Catalog volume; a serverless ingestion pipeline applies them to Delta tables."],
flow:[['Source database','Change tracking or CDC enabled, with a replication user.'],['UC connection','Stores host and credentials.'],['Ingestion gateway','Runs continuously on classic compute, extracts snapshots and changes into a staging volume.'],['Ingestion pipeline','Serverless pipeline applies changes as SCD type 1 or type 2.'],['Streaming tables','Governed bronze tables, ready for silver.']],
when:["CDC from SQL Server, MySQL or PostgreSQL without building Debezium and Kafka.","SaaS sources with a supported connector."],
avoid:["Unsupported sources or custom extraction logic: use Auto Loader, a bus, or a custom source.","You only need occasional queries: federate."],
senior:"I pick Connect whenever a connector exists, because the hard parts of CDC are operational: initial snapshot, log retention, schema changes, restarts. The cost to remember is that the gateway is always-on classic compute and the source must keep its change log long enough for outages.",
ex:[{t:'Ingestion pipeline in a bundle',lang:'yaml',code:`
resources:
  pipelines:
    sqlserver_ingest:
      name: sqlserver_ingest
      catalog: main
      schema: bronze_erp
      ingestion_definition:
        ingestion_gateway_id: \${resources.pipelines.erp_gateway.id}
        objects:
          - table:
              source_catalog: erp
              source_schema: dbo
              source_table: customers
              destination_catalog: main
              destination_schema: bronze_erp
              table_configuration:
                scd_type: SCD_TYPE_2`},
{t:'Read the ingested table downstream',code:`
# SCD2 output keeps history with __START_AT and __END_AT
current = (spark.read.table("main.bronze_erp.customers")
    .where("__END_AT IS NULL"))
changes = spark.readStream.option("skipChangeCommits", "true").table("main.bronze_erp.customers")`}],
traps:["The gateway is not serverless; the ingestion pipeline is.","SQL Server needs change tracking (tables with a primary key) or CDC (tables without one) enabled at the source."]});
F({id:'lakehouse-federation',title:'Lakehouse Federation',exam:'S2',
what:["Query external systems such as PostgreSQL, SQL Server, Snowflake, BigQuery or Redshift in place. A connection stores how to reach the system, and a foreign catalog exposes its schemas in Unity Catalog. Filters and aggregates are pushed down where possible."],
flow:[['CREATE CONNECTION','Host, port and a credential for the remote system.'],['CREATE FOREIGN CATALOG','Mirrors the remote database as a read-only catalog.'],['Grant in UC','Users need privileges on the foreign catalog; they never see the credential.'],['Query','Spark pushes predicates down and reads the result.']],
when:["Proofs of concept, ad hoc analysis, or a gradual migration.","Data that cannot be copied for policy reasons."],
avoid:["High-volume or frequent pipelines. Load on the source and latency make ingestion the better choice."],
senior:"Federation is governance plus convenience. Two layers of security apply: the connection credential decides what the remote system allows, and Unity Catalog decides which Databricks users may use it. Every user shares the connection identity unless you configure per-user credentials.",
ex:[{t:'Connection and foreign catalog',code:`
spark.sql("""
CREATE CONNECTION pg_crm TYPE postgresql
OPTIONS (host 'crm.acme.internal', port '5432',
         user secret('crm', 'user'), password secret('crm', 'pwd'))""")
spark.sql("CREATE FOREIGN CATALOG crm USING CONNECTION pg_crm OPTIONS (database 'crm')")
spark.sql("GRANT USE CATALOG, USE SCHEMA, SELECT ON CATALOG crm TO \`analysts\`")`},
{t:'Join federated and lakehouse data',code:`
accounts = spark.table("crm.public.accounts").where("region = 'EMEA'")   # pushed down
orders = spark.table("main.gold.fact_orders")
orders.join(accounts, "account_id").groupBy("segment").sum("amount").show()`}],
traps:["Foreign catalogs are read-only.","Privileges on the foreign catalog are needed in addition to what the connection user can do remotely."]});
F({id:'sharing-clean-rooms',title:'OpenSharing (Delta Sharing) and Clean Rooms',exam:'S2',
what:["Sharing gives another party live, read-only access to tables, views and volumes with no copy. Databricks-to-Databricks sharing links two Unity Catalog metastores by a sharing identifier. Open sharing gives any client a credential (token or OIDC) to read with a connector.",
"Clean Rooms let several parties run approved notebooks over combined data without anyone seeing the raw tables of the others."],
flow:[['Provider creates a share','A securable that lists tables, views, volumes.'],['Recipient','Databricks-to-Databricks uses a metastore identifier; open sharing issues a credential.'],['GRANT SELECT ON SHARE','Recipient gets access.'],['Recipient reads','As a catalog (D2D) or through a sharing client (open). Data stays in provider storage.']],
when:["Cross-organization or cross-region data exchange.","Joint analysis on sensitive data: Clean Rooms."],
avoid:["Recipients need to write back: sharing is read-only.","Same-metastore access: plain grants are enough."],
senior:"D2D when the other side has Unity Catalog, because there are no tokens to rotate and lineage and audit carry through. Open sharing for everyone else. Share with history only when the recipient needs time travel, streaming or the change feed.",
ex:[{t:'Provider: share a table with history',code:`

F({id:'sdp-overview',title:'Lakeflow Spark Declarative Pipelines (SDP)',major:true,exam:'S1',
what:["SDP is the framework that used to be called Delta Live Tables. You declare datasets (streaming tables, materialized views, views) and the flows that feed them; the pipeline works out the dependency graph, orchestration, checkpoints, retries, scaling and table maintenance.",

flow:[['Source code','Python or SQL files that declare tables and flows.'],['Dataflow graph','The pipeline resolves dependencies between datasets.'],['Update','Triggered (run and stop) or continuous. Each flow reads only new data where it can.'],['Expectations','Rows are checked; results are recorded.'],['Published tables','Streaming tables and materialized views in Unity Catalog, plus an event log.']],
when:["Medallion ETL where you want incremental processing without managing checkpoints.","CDC and SCD targets.","You need data quality rules with metrics recorded automatically."],
avoid:["Logic that needs arbitrary stateful operators, custom sinks per batch, or strict control of each micro-batch.","Imperative steps such as calling an API and branching on the result: that is a job."],
table:{title:'Building blocks',head:['Object','Python','Use for'],rows:[
['Streaming table','[[@dp.table]] or [[dp.create_streaming_table]]','Append-only incremental ingestion and CDC targets'],
['Materialized view','[[@dp.materialized_view]]','Aggregations and joins that must always equal the query result'],
['Temporary view','[[@dp.temporary_view]]','Intermediate logic that is not published'],
['Flow','[[@dp.append_flow]], [[dp.create_auto_cdc_flow]]','Writing into a target from one or more sources'],
['Sink','[[dp.create_sink]]','Writing to Kafka, Event Hubs or an external Delta table']]},
senior:"I default to SDP for anything that looks like bronze, silver, gold. The value is not the syntax; it is that restarts, backfills, schema location, checkpoints and lineage are no longer my code. I drop to Structured Streaming only for the few flows that need what SDP does not expose.",

@dp.table(name="silver_orders")
@dp.expect_or_drop("valid_id", "order_id IS NOT NULL")
def silver_orders():

        .withColumn("order_ts", F.to_timestamp("order_ts")))`},

from pyspark.sql import functions as F

@dp.materialized_view(name="gold_daily_revenue")

what:["AUTO CDC applies a change feed (inserts, updates, deletes with a sequence column) to a target streaming table as SCD type 1 or type 2. It orders events by [[sequence_by]], so late and out-of-order changes are applied correctly, which is the hard part of hand-written MERGE."],

avoid:["Only full snapshots exist: use AUTO CDC FROM SNAPSHOT.","Outside a pipeline: use MERGE in foreachBatch."],
senior:"The parameter that decides correctness is [[sequence_by]]. It must increase with the true order of changes at the source: a log sequence number or commit timestamp, never the ingestion time. For ties I pass a struct of two columns. For SCD2 I list only the columns whose history the business cares about, otherwise every noisy column creates a new version.",

    sequence_by=col("commit_ts"),

CREATE OR REFRESH STREAMING TABLE dim_customer_history;

CREATE FLOW customer_cdc AS AUTO CDC INTO dim_customer_history
FROM stream(main.bronze.customers_cdc)
KEYS (customer_id)
APPLY AS DELETE WHEN op = 'DELETE'
SEQUENCE BY commit_ts
COLUMNS * EXCEPT (op, commit_ts)
STORED AS SCD TYPE 2;`}],

F({id:'scd-types',title:'SCD types and which one to choose',major:true,exam:'S1, S9',
what:["A slowly changing dimension strategy answers one question: when an attribute changes, what happens to the old value? The answer drives storage, query complexity and what the business can ask later."],
flow:[['Attribute changes','A customer moves city.'],['Does anyone need the old value?','No: type 1.'],['For point-in-time facts?','Yes: type 2.'],['Only the previous value?','Type 3.'],['Changes very frequently?','Split into a history or mini-dimension: type 4.']],
table:{title:'Types',head:['Type','What it does','Choose when','Cost'],rows:[
['0','Never update','Immutable attributes such as birth date or original signup channel','None'],
['1','Overwrite in place','Corrections, or history has no business value','History is gone'],
['2','New row per version with validity range and current flag','Facts must join to the value that was true at the time; audit','Table grows; joins need a range condition'],
['3','Extra column for the previous value','Only one prior state matters, such as previous region after a reorg','No deeper history'],
['4','Current table plus separate history table','Fast-changing attributes; most queries want current only','Two tables to maintain'],
['6','Type 2 rows that also carry the current value (1 + 2 + 3)','Reports need both as-was and as-is without two joins','Updates touch all versions of a key']]},

from pyspark.sql import functions as F, Window
from delta.tables import DeltaTable
w = Window.partitionBy("customer_id").orderBy(F.col("seq").desc())
latest = changes.withColumn("rn", F.row_number().over(w)).where("rn = 1").drop("rn")

(DeltaTable.forName(spark, "main.silver.customers").alias("t")
    .merge(latest.alias("s"), "t.customer_id = s.customer_id")
    .whenMatchedDelete(condition="s.op = 'D'")

def upsert(batch_df, batch_id):
    w = Window.partitionBy("customer_id").orderBy(F.col("seq").desc())
    latest = batch_df.withColumn("rn", F.row_number().over(w)).where("rn = 1").drop("rn")
    (DeltaTable.forName(batch_df.sparkSession, "main.silver.customers").alias("t")
        .merge(latest.alias("s"), "t.customer_id = s.customer_id")
        .whenMatchedUpdateAll(condition="s.seq > t.seq")
        .whenNotMatchedInsertAll().execute())

(spark.readStream.table("main.bronze.customers_cdc").writeStream
    .foreachBatch(upsert)
    .option("checkpointLocation", "/Volumes/main/ops/chk/customers_scd1")
    .trigger(availableNow=True).start())`}],

what:["Hand-written type 2 closes the current row and inserts a new one in the same MERGE. The usual trick stages each changed row twice: once with the real key so it matches and closes the old version, once with a null merge key so it falls through to the insert clause."],
flow:[['Incoming changes','Latest row per key.'],['Find real changes','Join to current rows and compare tracked columns.'],['Stage twice','Null merge key for the new version, real key for the close.'],['MERGE','Matched: set end date and current flag false. Not matched: insert the new current row.']],

from pyspark.sql import functions as F
from delta.tables import DeltaTable
tgt = DeltaTable.forName(spark, "main.gold.dim_customer")
cur = tgt.toDF().where("is_current")

changed = (src.alias("s").join(cur.alias("t"), "customer_id")
    .where("s.address <> t.address OR s.segment <> t.segment").select("s.*"))

staged = (changed.withColumn("merge_key", F.lit(None).cast("string"))
    .unionByName(src.withColumn("merge_key", F.col("customer_id"))))

(tgt.alias("t").merge(staged.alias("s"), "t.customer_id = s.merge_key AND t.is_current")
    .whenMatchedUpdate(
        condition="t.address <> s.address OR t.segment <> s.segment",
        set={"is_current": "false", "end_date": "s.effective_date"})
    .whenNotMatchedInsert(values={
        "customer_id": "s.customer_id", "address": "s.address", "segment": "s.segment",
        "start_date": "s.effective_date", "end_date": "null", "is_current": "true"})
    .execute())`},

F({id:'change-data-feed',title:'Change Data Feed',major:true,exam:'S5',
what:["Change Data Feed exposes the row-level changes between versions of a Delta table: inserts, deletes, and the before and after image of updates. Downstream jobs read only what changed, which avoids full recomputation.",
"On Runtime 19 with row tracking, changes are computed at query time (automatic change data feed), so you do not have to enable the feed on every table."],
flow:[['Table is modified','MERGE, UPDATE, DELETE or append.'],['Changes recorded','Per commit, with [[_change_type]], [[_commit_version]], [[_commit_timestamp]].'],['Consumer reads the feed','Batch between versions, or as a stream.'],['Apply downstream','Update aggregates, propagate deletes, feed AUTO CDC.']],
when:["Silver tables with updates and deletes that feed gold incrementally.","Propagating GDPR deletes downstream.","Replicating a table to another system."],
avoid:["Append-only tables: a normal stream already gives you new rows.","Keeping an audit trail forever: the feed follows table retention."],
senior:"CDF is the bridge between a table that gets merged into and a stream that expects appends. The pattern I use most: AUTO CDC builds silver, silver's change feed drives gold. I filter out [[update_preimage]] unless I am maintaining an aggregate that needs to subtract the old value.",
ex:[{t:'Enable and read changes in batch',code:`
spark.sql("ALTER TABLE main.silver.customers SET TBLPROPERTIES (delta.enableChangeDataFeed = true)")

changes = (spark.read
    .option("readChangeFeed", "true")
    .option("startingVersion", 15).option("endingVersion", 20)
    .table("main.silver.customers"))
changes.where("_change_type IN ('insert', 'update_postimage', 'delete')").show()`},
{t:'Stream the feed into a downstream MERGE',code:`
from delta.tables import DeltaTable
def apply(batch, _):
    latest = batch.where("_change_type <> 'update_preimage'")   # dedupe per key in real code
    (DeltaTable.forName(batch.sparkSession, "main.gold.customer_360").alias("t")
        .merge(latest.alias("s"), "t.customer_id = s.customer_id")
        .whenMatchedDelete(condition="s._change_type = 'delete'")
        .whenMatchedUpdateAll().whenNotMatchedInsertAll().execute())

(spark.readStream.option("readChangeFeed", "true").table("main.silver.customers")
    .writeStream.foreachBatch(apply)
    .option("checkpointLocation", "/Volumes/main/ops/chk/customer_360").start())`}],

['[[processingTime="1 minute"]]','Fixed interval','Predictable load, fewer small files'],
['[[availableNow=True]]','Process the backlog in several batches and stop','Scheduled incremental batch'],
['Real-time mode','Very low latency processing on supported sources and sinks','Operational use cases under a second'],
['[[once=True]]','Single batch, deprecated','Do not choose']]},
when:["Any incremental processing, including what people call batch."],avoid:["Sharing one checkpoint between two queries. One query, one checkpoint."],

F({id:'watermarks-state',parent:'streaming-core',title:'Watermarks, state and output modes',major:true,exam:'S1',
what:["Stateful operators (windowed aggregations, deduplication, stream-stream joins) keep data in a state store between batches. A watermark tells the engine how late data may arrive: watermark = max event time seen minus the threshold. State older than the watermark is dropped, and rows older than it are discarded."],
flow:[['Event arrives','With an event-time column.'],['Update max event time','Tracked across the stream.'],['Compute watermark','Max event time minus the delay, for example 10 minutes.'],['Aggregate in state','The matching window is updated.'],['Emit and evict','In append mode a window is emitted once the watermark passes its end; its state is then removed.']],
table:{title:'Output modes',head:['Mode','Emits','Works with'],rows:[
['append (default)','Only rows that will never change again','Stateless queries; aggregations only with a watermark'],
['update','Rows changed in this batch','Aggregations; use [[foreachBatch]] with MERGE to write to Delta'],
['complete','The whole result every batch','Small aggregations without watermark eviction']]},
when:["Any aggregation, deduplication or join on an unbounded stream."],avoid:["Unbounded state: aggregation or dropDuplicates without a watermark grows until the job fails."],
senior:"The watermark delay is a business decision: how long are we willing to wait for late data before publishing a number. Longer delay means more complete results, more state and later output. I size it from measured lateness, not from a guess, and use RocksDB as the state store once state is more than a few million keys.",
ex:[{t:'Tumbling window aggregation with late data bound',code:`

    .groupBy(F.window("event_ts", "5 minutes"), "device_id")
    .agg(F.count("*").alias("events"), F.avg("temp").alias("avg_temp")))
(agg.writeStream.outputMode("append")
    .option("checkpointLocation", "/Volumes/main/ops/chk/device_5m")

    .withWatermark("paid_at", "1 hour")

F({id:'advanced-streaming',parent:'streaming-core',title:'transformWithState and real-time mode',
what:["[[transformWithState]] is the current API for custom stateful streaming: per key you keep typed state (value, list, map), register timers and set time-to-live, which covers sessionization, alerting and state machines. Real-time mode runs supported queries with very low latency (milliseconds) for operational use cases such as fraud scoring, instead of micro-batches."],
flow:[['Grouped stream','Events keyed by user or device.'],['StatefulProcessor','init creates state; handleInputRows updates it.'],['Timers and TTL','Fire logic after inactivity; expire old state.'],['Emit rows','Your processor decides what to output.'],['Real-time trigger','Optional: process records as they arrive.']],
when:["Business logic that built-in aggregations cannot express.","Latency requirements below what micro-batches give."],
avoid:["Windowed counts and deduplication: built-in operators are simpler.","Real-time mode for heavy aggregations into Delta: it targets low-latency pipelines with supported sinks such as Kafka."],
senior:"Before writing a stateful processor I check whether a watermark plus a window or dropDuplicatesWithinWatermark does the job. When it does not, transformWithState with TTL is far safer than the older mapGroupsWithState, because state cannot grow without bound by accident.",
ex:[{t:'Running count per user with transformWithStateInPandas',code:`
import pandas as pd
from pyspark.sql.streaming import StatefulProcessor, StatefulProcessorHandle
from pyspark.sql.types import StructType, StructField, LongType

class EventCounter(StatefulProcessor):
    def init(self, handle: StatefulProcessorHandle) -> None:
        self.count = handle.getValueState("count", StructType([StructField("n", LongType())]))

    def handleInputRows(self, key, rows, timerValues):
        n = self.count.get()[0] if self.count.exists() else 0
        for pdf in rows:
            n += len(pdf)
        self.count.update((n,))
        yield pd.DataFrame({"user_id": [key[0]], "events": [n]})

    def close(self) -> None:
        pass

counts = (spark.readStream.table("main.silver.events").groupBy("user_id")
    .transformWithStateInPandas(statefulProcessor=EventCounter(),
        outputStructType="user_id string, events long", outputMode="Update", timeMode="None"))`},

    .start())`}],
