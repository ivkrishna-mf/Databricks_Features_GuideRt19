['Repair run','Reruns failed and dependent tasks in the same job run; successful tasks are kept']]},
senior:"I keep jobs thin: orchestration and parameters only, with logic in pipelines and tested Python packages. For recovery I rely on repair runs rather than rerunning the job, which only works if every task is idempotent.",
ex:[{t:'Pass a value between tasks and branch on it',code:`
# Task "check_source"
rows = spark.table("main.bronze.orders").where("ingest_date = current_date()").count()
dbutils.jobs.taskValues.set(key="row_count", value=rows)

# If/else condition task: {{tasks.check_source.values.row_count}} > 0
# Task "transform" (runs on the true branch)
n = dbutils.jobs.taskValues.get(taskKey="check_source", key="row_count", debugValue=0)
run_date = dbutils.widgets.get("run_date")          # from {{job.parameters.run_date}}`},
{t:'For each loop and a conditional task in a bundle',lang:'yaml',code:`
resources:
  jobs:
    nightly_load:
      name: nightly_load
      parameters:
        - name: run_date
          default: "{{job.start_time.iso_date}}"
      tasks:
        - task_key: list_tables
          notebook_task: { notebook_path: ../src/list_tables.py }
        - task_key: load_each
          depends_on: [{ task_key: list_tables }]
          for_each_task:
            inputs: "{{tasks.list_tables.values.tables}}"
            concurrency: 4
            task:
              task_key: load_one
              notebook_task:
                notebook_path: ../src/load_table.py
                base_parameters: { table: "{{input}}" }
        - task_key: notify_failure
          depends_on: [{ task_key: load_each }]
          run_if: AT_LEAST_ONE_FAILED
          notebook_task: { notebook_path: ../src/notify.py }`}],
traps:["Repair keeps the same run id and reruns only failed, skipped and downstream tasks.","Task values are for small values, not DataFrames.","A continuous trigger restarts the job after it ends or fails; it is not the same as a continuous pipeline."]});
F({id:'compute-choices',title:'Choosing compute',exam:'S1, S5',
what:["Compute choice is a cost and isolation decision. Serverless starts in seconds and needs no sizing. Job compute is created for a run and terminated after. All-purpose compute is for interactive work and costs more per unit."],
flow:[['Workload','Interactive, scheduled job, pipeline or SQL.'],['Serverless available and suitable?','Use it.'],['Needs custom runtime, init scripts or special instances?','Classic job compute.'],['Set environment','Dependencies in a serverless environment or cluster libraries.'],['Run and observe','Use system tables to check cost.']],
table:{title:'Options',head:['Compute','Choose when','Watch out'],rows:[
['Serverless jobs and notebooks','Default for most Python and SQL work','Performance optimized mode starts faster and costs more; standard mode is cheaper with a longer startup'],
['Classic job compute','Custom Spark configs, init scripts, GPUs, private networking needs','Startup minutes; you size and tune it'],
['All-purpose compute','Development and exploration','Most expensive way to run a schedule'],
['SQL warehouse (serverless)','SQL tasks, dashboards, alerts','Not for Python'],
['Pipeline compute','Managed by the pipeline, serverless or classic','Edition and mode affect features and price']]},
when:["Serverless: variable or bursty load, small teams, fast start.","Classic: stable heavy jobs you have tuned, or features serverless lacks."],
avoid:["Running scheduled jobs on an all-purpose cluster.","Dedicated access mode when several users share a cluster: use standard access mode."],
senior:"I start serverless and move a job to classic compute only with a number that justifies it. On serverless I set the environment explicitly, choose standard performance mode for anything not latency-bound, and turn off automatic retries for tasks that are not idempotent.",
ex:[{t:'Serverless job task with an environment and standard mode',lang:'yaml',code:`
resources:
  jobs:
    daily_enrich:
      performance_target: STANDARD           # PERFORMANCE_OPTIMIZED for faster start
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ["./dist/*.whl", "rapidfuzz==3.9.7"]
      tasks:
        - task_key: enrich
          environment_key: default
          spark_python_task: { python_file: ../src/enrich.py }
          disable_auto_optimization: true    # no automatic retries on serverless`},
{t:'Classic job cluster when you need control',lang:'yaml',code:`
      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: 19.x-scala2.13     # pick the exact key your workspace lists
            node_type_id: i3.2xlarge
            data_security_mode: USER_ISOLATION   # standard access mode
            autoscale: { min_workers: 2, max_workers: 8 }
            spark_conf: { "spark.sql.shuffle.partitions": "auto" }`}],
traps:["Standard (formerly shared) and dedicated (formerly single user) access modes both support Unity Catalog; no-isolation shared does not.","High memory is a notebook task setting on serverless for memory-heavy driver work.","Serverless ignores most Spark configs."]});
F({id:'declarative-automation-bundles',title:'Declarative Automation Bundles',major:true,exam:'S1, S8',
what:["Bundles (formerly Databricks Asset Bundles) describe a project as code: source files plus YAML or Python definitions of jobs, pipelines, schemas, volumes, dashboards and more. The CLI validates and deploys the same definition to each target, such as dev, staging and prod."],
flow:[['databricks bundle init','Start from a template.'],['Edit databricks.yml','Bundle name, includes, variables, resources, targets.'],['bundle validate','Checks the configuration.'],['bundle deploy -t dev','Uploads files and creates or updates resources.'],['bundle run','Runs a job or pipeline. CI repeats this for prod with a service principal.']],
when:["Any project that will be deployed to more than one environment.","You want reviews and rollbacks for jobs and pipelines, not only for code."],
avoid:["Managing workspaces, networks and account-level setup: that is Terraform territory."],
senior:"The structure I use: [[src/]] for a Python package with pure transformation functions, [[resources/]] with one YAML per job or pipeline, [[tests/]], and a short [[databricks.yml]] with variables and targets. Development mode gives every engineer an isolated, prefixed copy; production mode deploys from CI as a service principal and nobody deploys by hand.",
ex:[{t:'databricks.yml with two targets',lang:'yaml',code:`
bundle:
  name: orders_platform

include:
  - resources/*.yml

variables:
  catalog:
    default: dev

artifacts:
  orders_lib:
    type: whl
    path: .

targets:
  dev:
    mode: development          # prefixes names, pauses schedules
    default: true
    workspace: { host: https://dev.cloud.databricks.com }
  prod:
    mode: production
    workspace: { host: https://prod.cloud.databricks.com, root_path: /Workspace/Shared/.bundle/orders }
    variables: { catalog: main }
    run_as: { service_principal_name: "sp-orders-deploy" }`},
{t:'A pipeline resource and the deploy commands',lang:'yaml',code:`
# resources/orders_pipeline.yml
resources:
  pipelines:
    orders:
      name: orders_\${bundle.target}
      catalog: \${var.catalog}
      schema: orders
      serverless: true
      libraries:
        - glob: { include: ../src/pipelines/** }

# Shell:
#   databricks bundle validate -t prod
#   databricks bundle deploy   -t prod
#   databricks bundle run orders -t prod`}],
traps:["Development mode prefixes resources with the user name and pauses triggers; production mode validates that you are not deploying from a personal path.","The rename is non-breaking: the command is still [[databricks bundle]].","[[bundle deployment bind]] links an existing job or pipeline to a bundle resource."]});
F({id:'git-folders-cicd',title:'Git folders and CI/CD',exam:'S8',
what:["Git folders (formerly Repos) connect a workspace folder to a Git repository so you can branch, commit, pull and review. In CI/CD, a pipeline runs tests on pull requests and deploys the bundle on merge."],
flow:[['Feature branch','Develop in a Git folder or locally.'],['Pull request','CI runs unit tests and [[bundle validate]].'],['Merge to main','CI deploys to staging and runs integration tests.'],['Release','CI deploys to prod as a service principal.'],['Run','Jobs run the deployed, versioned code.']],
when:["Team development with reviews.","Promotion across environments."],
avoid:["Production jobs pointing at a user's Git folder or a moving branch that anyone can change."],
senior:"Production runs deployed artifacts from a bundle, never a personal folder. If a job must read from Git directly, it points at a tag or release branch. Authentication in CI is OAuth for a service principal, ideally with workload identity federation so there is no stored secret.",
ex:[{t:'CI workflow: test, validate, deploy',lang:'yaml',code:`
# .github/workflows/deploy.yml
on:
  push: { branches: [main] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: \${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: \${{ secrets.SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: \${{ secrets.SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: pip install -e ".[dev]" && pytest tests/unit
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod`},
{t:'Update a Git folder to a branch with the SDK',code:`
from databricks.sdk import WorkspaceClient
w = WorkspaceClient()
repo = next(r for r in w.repos.list(path_prefix="/Repos/release/orders"))
w.repos.update(repo_id=repo.id, branch="release")      # pull latest of the branch`}],
traps:["Git folders version files, not jobs or clusters. Bundles deploy resources.","Notebook outputs are not committed by default."]});
F({id:'testing',title:'Unit and integration testing',exam:'S1',
what:["Testable pipelines keep transformations as functions from DataFrame to DataFrame. [[pyspark.testing]] gives [[assertDataFrameEqual]] and [[assertSchemaEqual]]. [[DataFrame.transform]] chains those functions in production code."],
flow:[['Pure function','Takes a DataFrame, returns a DataFrame. No reads or writes inside.'],['Unit test','Small in-memory input, expected output, assert equal.'],['Compose','[[df.transform(f).transform(g)]] in the job or pipeline.'],['Integration test','Deploy the bundle to a test target and run on sample data.'],['CI gate','Both must pass before deploy.']],
when:["Always for business logic. Bugs in joins and window logic are cheap to catch here."],
avoid:["Tests that depend on production tables or on row order."],
senior:"If a transformation cannot be tested without a cluster and a real table, the design is the problem. I separate I/O from logic, test logic with ten-row DataFrames, and use expectations plus a small integration run for everything else.",
ex:[{t:'Transformations as functions, chained with transform',code:`
from pyspark.sql import DataFrame, functions as F

def with_net(df: DataFrame, rate: float) -> DataFrame:
    return df.withColumn("net", F.round(F.col("gross") / (1 + rate), 2))

def only_paid(df: DataFrame) -> DataFrame:
    return df.where("status = 'PAID'")

silver = spark.table("main.bronze.orders").transform(only_paid).transform(with_net, 0.2)`},
{t:'pytest unit test',code:`
from pyspark.testing import assertDataFrameEqual, assertSchemaEqual
from orders.transforms import with_net, only_paid

def test_net_for_paid_orders(spark):
    src = spark.createDataFrame([(1, "PAID", 120.0), (2, "OPEN", 60.0)], "id int, status string, gross double")
    out = src.transform(only_paid).transform(with_net, 0.2)
    expected = spark.createDataFrame([(1, "PAID", 120.0, 100.0)], "id int, status string, gross double, net double")
    assertSchemaEqual(out.schema, expected.schema)
    assertDataFrameEqual(out, expected)          # ignores row order by default`}],
traps:["[[assertDataFrameEqual]] ignores row order unless [[checkRowOrder=True]].","Floats compare with a tolerance ([[rtol]], [[atol]])."]});
F({id:'dependencies',title:'Libraries and dependency troubleshooting',exam:'S1',
what:["Where a library is declared depends on the compute. Serverless jobs and notebooks use an environment with a dependency list. Pipelines declare dependencies in the pipeline environment. Classic clusters use cluster or task libraries. Notebook-scoped [[%pip]] installs apply to one session."],
flow:[['Import fails or wrong version','Read the error: not found, conflict, or build failure.'],['Find the scope','Serverless environment, pipeline environment, cluster library or notebook.'],['Pin','Exact versions; build your own code as a wheel.'],['Rebuild the environment','Redeploy the bundle or restart Python.'],['Verify','Print the version in the task.']],
when:["Wheels for your own code.","Pinned PyPI versions for everything else."],
avoid:["Unpinned installs in production.","Installing over packages the runtime depends on, such as pyspark or numpy, without checking compatibility."],
senior:"Most dependency incidents are one of three: a package the runtime no longer ships, two libraries pinning different versions of a shared dependency, or a source build that needs a compiler the image lacks. The fix is always the same discipline: one lock file, wheels built in CI, and the same environment spec in every target.",
ex:[{t:'Pipeline environment with dependencies',lang:'yaml',code:`
resources:
  pipelines:
    orders:
      serverless: true
      environment:
        dependencies:
          - ../dist/orders_lib-1.4.0-py3-none-any.whl
          - pydantic==2.9.2
      libraries:
        - glob: { include: ../src/pipelines/** }`},
{t:'Diagnose a version conflict in a notebook',code:`
%pip install rapidfuzz==3.9.7 "pydantic>=2.8,<3"
dbutils.library.restartPython()

import importlib.metadata as md
for pkg in ["pydantic", "rapidfuzz", "pyarrow"]:
    print(pkg, md.version(pkg))`}],
traps:["After [[%pip install]] you must restart Python for already-imported modules.","[[%pip]] does not work in pipeline source files; declare dependencies in the pipeline environment.","A wheel built for a different Python version fails to install on a newer runtime."]});

C('08-performance-cost','Performance and cost');
F({id:'liquid-clustering',title:'Liquid clustering, partitioning and ZORDER',major:true,exam:'S5, S9',
what:["All three co-locate related data so queries skip files. Partitioning splits a table into directories by column value. ZORDER rewrites files to cluster by columns within a partition. Liquid clustering clusters incrementally, lets you change keys without rewriting the table, and with [[CLUSTER BY AUTO]] picks keys from query history."],
flow:[['Rows written','Into files tagged with min and max statistics.'],['OPTIMIZE','Groups rows by the clustering keys, incrementally.'],['Query with a filter','Engine compares the filter with file statistics.'],['Skip files','Only matching files are read.'],['Keys change','ALTER TABLE CLUSTER BY; new data follows the new keys.']],
table:{title:'Comparison',head:['','Liquid clustering','Partitioning','ZORDER'],rows:[
['Best for','Most tables; high-cardinality or changing filters','Very large tables with a low-cardinality column used in nearly every query, or lifecycle by partition','Legacy tables you cannot convert yet'],
['Change keys','Yes, no rewrite','No, rewrite the table','Yes, but full rewrite on next OPTIMIZE'],
['Maintenance','Incremental; automatic with predictive optimization','None, but small files per partition','Not incremental; reruns are expensive'],
['Skew and cardinality','Handles both','High cardinality creates tiny files','Fine for high cardinality'],
['Combine','Not with partitioning or ZORDER','With ZORDER','With partitioning']]},
when:["Liquid: every new table. Up to four keys; start with the most common filter columns.","[[CLUSTER BY AUTO]]: managed tables where query patterns vary and you do not want to choose."],
avoid:["Partitioning tables under about a terabyte or on high-cardinality columns.","Adding ZORDER to a liquid clustered table: not allowed."],
senior:"New table: liquid clustering, and AUTO if it is a managed table with predictive optimization. I keep partitioning only where something depends on it, such as dropping a whole day as a metadata operation or an external reader that expects directories. If a question mentions changing query patterns, skewed keys or 'no rewrite', the answer is liquid clustering.",
ex:[{t:'Create, change keys and optimize',code:`
spark.sql("""
CREATE TABLE main.silver.events (event_id STRING, user_id STRING, event_date DATE, country STRING)
CLUSTER BY (event_date, user_id)""")
spark.sql("ALTER TABLE main.silver.events CLUSTER BY (country, event_date)")
spark.sql("OPTIMIZE main.silver.events")            # incremental
spark.sql("OPTIMIZE main.silver.events FULL")       # recluster existing data to new keys`},
{t:'Automatic keys, and clustering from the DataFrame API',code:`
spark.sql("ALTER TABLE main.silver.orders CLUSTER BY AUTO")

(df.write.mode("overwrite")
    .clusterBy("order_date", "customer_id")
    .saveAsTable("main.silver.orders_v2"))`}],
traps:["[[CLUSTER BY AUTO]] requires a Unity Catalog managed table with predictive optimization.","ZORDER BY cannot use partition columns, and is ignored for data written after the last OPTIMIZE.","Clustering keys must have statistics collected (within the indexed columns)."]});
F({id:'deletion-vectors',title:'Deletion vectors',exam:'S5, S6',
what:["Without deletion vectors, deleting one row rewrites the whole Parquet file. With them, Delta writes a small bitmap that marks rows as removed and readers skip those rows. DELETE, UPDATE and MERGE become much faster; the physical rewrite happens later during OPTIMIZE or REORG."],
flow:[['DELETE one row','In a large file.'],['Write deletion vector','A bitmap marks the row; the data file is untouched.'],['Readers','Apply the bitmap and skip the row.'],['OPTIMIZE or REORG PURGE','Rewrites the file without the row.'],['VACUUM','Removes the old file after retention.']],
when:["Tables with frequent small updates, deletes or merges.","Almost always: it is the default for new tables in most workspaces."],
avoid:["Old external readers that do not support the table feature."],
senior:"Deletion vectors make writes cheap by deferring work, so the row is logically gone but still physically in the file. For privacy deletes that matters: the job is not finished until REORG PURGE and VACUUM have run.",
ex:[{t:'Enable and delete',code:`
spark.sql("ALTER TABLE main.silver.customers SET TBLPROPERTIES ('delta.enableDeletionVectors' = true)")
spark.sql("DELETE FROM main.silver.customers WHERE customer_id = 'C-1042'")
spark.sql("DESCRIBE HISTORY main.silver.customers").select("operation", "operationMetrics").show(1, False)`},
{t:'Physically remove soft-deleted rows',code:`
spark.sql("REORG TABLE main.silver.customers APPLY (PURGE)")      # rewrite files that have deletion vectors
spark.sql("VACUUM main.silver.customers RETAIN 168 HOURS")       # then drop old files after 7 days`}],
traps:["Enabling deletion vectors upgrades the table protocol; older clients cannot read it.","A deleted row remains in the data file until it is rewritten and vacuumed."]});
F({id:'predictive-optimization',title:'Predictive optimization, OPTIMIZE and VACUUM',major:true,exam:'S5',
what:["OPTIMIZE compacts small files and applies clustering. VACUUM deletes files no longer referenced and older than the retention period. ANALYZE collects statistics. Predictive optimization runs all three automatically for Unity Catalog managed tables, choosing when it pays off."],
flow:[['Writes create small files','Especially streaming and MERGE.'],['Predictive optimization','Decides per table what is worth running.'],['OPTIMIZE','Compacts and clusters.'],['ANALYZE','Refreshes statistics for the optimizer.'],['VACUUM','Removes unreferenced files past retention; storage cost drops.']],
when:["Managed tables: enable predictive optimization at account, catalog or schema level and stop scheduling maintenance jobs.","External tables: schedule OPTIMIZE and VACUUM yourself."],
avoid:["VACUUM with a retention shorter than your longest running query or stream lag."],
senior:"Scheduled OPTIMIZE and VACUUM notebooks are legacy on managed tables. I enable predictive optimization, check [[system.storage.predictive_optimization_operations_history]] to see what it did, and only tune write-time settings such as optimized writes where streaming creates many tiny files.",
ex:[{t:'Enable for a catalog and inspect what ran',code:`
spark.sql("ALTER CATALOG main ENABLE PREDICTIVE OPTIMIZATION")
(spark.table("system.storage.predictive_optimization_operations_history")
    .where("catalog_name = 'main'")
    .groupBy("operation_type").count().show())`},
{t:'Manual maintenance for an external table',code:`
spark.sql("OPTIMIZE main.raw.partner_feed")
spark.sql("ALTER TABLE main.raw.partner_feed SET TBLPROPERTIES ("
          "'delta.autoOptimize.optimizeWrite' = 'true', 'delta.autoOptimize.autoCompact' = 'true')")
spark.sql("VACUUM main.raw.partner_feed RETAIN 168 HOURS")`}],
traps:["Default VACUUM retention is 7 days. After VACUUM you cannot time travel to versions whose files were removed.","OPTIMIZE is idempotent and does not change data, but it creates new files, so storage rises until VACUUM runs.","Predictive optimization does not apply to external tables."]});
F({id:'disk-cache-photon',title:'Disk cache, data skipping and Photon',exam:'S5',
what:["The disk cache (formerly Delta cache) keeps copies of remote Parquet data on the local SSDs of workers, so repeated reads of the same files skip cloud storage. Data skipping uses per-file min and max statistics to avoid reading files at all. Photon is the vectorized engine that runs SQL and DataFrame operations faster."],
flow:[['First query','Reads files from cloud storage and stores them on local SSD.'],['Second query','Same files are read from the local disk.'],['File changes','Cache detects it and refreshes automatically.'],['Cluster stops','The cache is gone; it is not persistent.']],
when:["Repeated reads of the same tables: BI and iterative development.","SSD-backed workers and SQL warehouses, where it is on by default."],
avoid:["Expecting it to help write-heavy ETL that reads each file once."],
table:{title:'Disk cache or Spark cache',head:['','Disk cache','Spark cache ([[.cache()]])'],rows:[
['Stores','Remote files on local SSD','Computed DataFrame in memory or disk'],
['Triggered','Automatically on read','Manually'],
['Stays correct when files change','Yes','No, must be invalidated'],
['Best for','Repeated table scans','An expensive intermediate result reused in one job']]},
senior:"I rarely call [[.cache()]] on a Delta table. It pins a snapshot in memory, bypasses data skipping on later filters and competes with execution memory. The disk cache gives most of the benefit with no code.",
ex:[{t:'Check and enable the disk cache',code:`
print(spark.conf.get("spark.databricks.io.cache.enabled"))
spark.conf.set("spark.databricks.io.cache.enabled", "true")
spark.sql("CACHE SELECT order_id, amount FROM main.gold.fact_orders WHERE order_date >= '2026-01-01'")   # preload`},
{t:'Make data skipping work for you',code:`
# Filters on clustered columns with literal values prune files
fast = spark.table("main.silver.events").where("event_date = '2026-11-01' AND country = 'DE'")
# A function on the column hides it from file statistics
slow = spark.table("main.silver.events").where("date_format(event_date, 'yyyy-MM') = '2026-11'")
fast.explain("formatted")`}],
traps:["Disk cache is per cluster and lost on termination.","Statistics are collected for a limited set of columns (the first 32 by default on external tables); long strings are poor skipping columns.","Photon does not speed up Python UDFs or RDD code."]});
F({id:'query-tuning',title:'Query profile, Spark UI and common bottlenecks',major:true,exam:'S5, S8',
what:["The query profile (SQL warehouses and serverless) and the Spark UI (classic compute) show where time goes: scan, shuffle, join, spill, skew. Adaptive Query Execution fixes much at runtime by coalescing partitions, switching join strategies and splitting skewed partitions."],
flow:[['Slow query','Open the query profile or the SQL tab of the Spark UI.'],['Scan','Files read against files pruned. Low pruning means clustering or filter problems.'],['Join','Broadcast or sort-merge. Row explosion means bad keys.'],['Shuffle','Size, spill to disk, one task far slower than the rest (skew).'],['Fix','Clustering, filter rewrite, broadcast, more partitions or memory, salting.']],
table:{title:'Symptom to cause',head:['What you see','Likely cause','Fix'],rows:[
['Most files read, few rows returned','No data skipping on the filter column','Cluster by that column; avoid functions on it'],
['One task takes most of the stage time','Skewed key','Let AQE skew join work, filter nulls, salt, or broadcast'],
['Spill (memory and disk) in the stage','Partitions too large','More shuffle partitions (or auto), larger workers'],
['Sort-merge join with a small table','Statistics missing or threshold too low','ANALYZE, broadcast hint'],
['Many tiny tasks and files','Too many partitions or small files','OPTIMIZE, optimized writes, coalesce'],
['Driver out of memory','[[collect]], [[toPandas]], huge broadcast','Keep data distributed'],
['Executor lost, exit code 137','Out of memory on a worker','Fewer cores per memory, fix skew, avoid giant UDF batches']]},
when:["Any time a job gets slower or more expensive: look before changing configs."],
senior:"I read the profile from the scan upward. If the scan reads the whole table, nothing downstream will save the query. Cluster logs split by purpose: driver logs for your own errors and stack traces, executor logs for task failures, event logs for cluster lifecycle such as spot loss.",
ex:[{t:'Read the plan and fix a skewed join',code:`
from pyspark.sql import functions as F
spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
orders = spark.table("main.silver.orders").where("customer_id IS NOT NULL")   # null keys skew
dims = spark.table("main.silver.customers")
joined = orders.join(dims.hint("broadcast"), "customer_id")
joined.explain("formatted")       # look for BroadcastHashJoin and PushedFilters`},
{t:'Find the most expensive queries from system tables',code:`
top = spark.sql("""
SELECT statement_id, executed_by, total_duration_ms, read_files, pruned_files, spilled_local_bytes
FROM system.query.history
WHERE start_time >= current_date() - INTERVAL 1 DAY
ORDER BY total_duration_ms DESC LIMIT 20""")
top.show(truncate=False)`}],
traps:["A broadcast join has no shuffle on the large side; a sort-merge join shuffles both.","Spill means partitions do not fit in memory; it is not fixed by caching.","In the Spark UI, skew shows as a large gap between median and max task duration or shuffle read size."]});

C('09-governance-security','Governance and security');
F({id:'unity-catalog-model',title:'Unity Catalog object model and inheritance',major:true,exam:'S6, S7',
what:["Unity Catalog is the governance layer. Securable objects form a hierarchy: metastore, catalog, schema, then tables, views, volumes, functions and models. Privileges granted on a parent are inherited by current and future children."],
flow:[['Metastore','One per region, attached to workspaces.'],['Catalog','Top-level container, often per environment or domain.'],['Schema','Groups related objects.'],['Table, view, volume, function','The data and code objects.'],['Query','Needs USE CATALOG, USE SCHEMA and the object privilege.']],
when:["Always for new work. It is required for serverless, lineage, sharing, ABAC and predictive optimization."],
avoid:["Granting to individual users. Grant to groups."],
senior:"I design catalogs around ownership boundaries (environment or domain), grant at the schema level to groups, and make groups or service principals the owners. Inheritance means one grant at the right level replaces hundreds of table grants.",
ex:[{t:'Grants that inherit',code:`
spark.sql("GRANT USE CATALOG ON CATALOG main TO \`data_analysts\`")
spark.sql("GRANT USE SCHEMA, SELECT ON SCHEMA main.gold TO \`data_analysts\`")   # all current and future tables
spark.sql("SHOW GRANTS ON SCHEMA main.gold").show(truncate=False)`},
{t:'Three-level names and volumes',code:`
df = spark.table("main.gold.daily_revenue")
spark.sql("CREATE VOLUME IF NOT EXISTS main.landing.orders")
files = dbutils.fs.ls("/Volumes/main/landing/orders/")
spark.sql("ALTER SCHEMA main.gold OWNER TO \`gold_owners\`")`}],
traps:["SELECT on a table is not enough: the user also needs USE CATALOG and USE SCHEMA on its parents.","A grant on a catalog applies to schemas and tables created later.","Owners have all privileges on the object and can grant them; MANAGE delegates that without changing the owner."]});

F({id:'row-filters-masks-abac',title:'Row filters, column masks and ABAC',major:true,exam:'S6',
what:["A row filter is a SQL function that returns true for rows a user may see. A column mask is a function that returns the value a user may see. You can attach them table by table, or define an ABAC policy once on a catalog or schema that applies to every column carrying a governed tag."],
flow:[['Tag data','Governed tag such as pii = email on columns.'],['Write a function','Returns the masked value or a boolean, based on group membership.'],['Create a policy','On a catalog or schema: which principals, which tag.'],['New table appears','Tagged columns are covered automatically.'],['Query','Filters and masks are applied at run time for every access path.']],
table:{title:'Options',head:['Approach','Scope','Choose when'],rows:[
['Dynamic view','One view','Legacy pattern, or sharing a restricted projection'],
['Row filter / column mask on a table','One table','A few sensitive tables'],
['ABAC policy with governed tags','Catalog or schema','Many tables; rules must follow the data classification']]},
when:["Different audiences need different slices of the same table.","PII must be masked consistently everywhere."],
avoid:["Copying tables per audience.","Heavy logic in the function: it runs for every query."],
senior:"Table-level masks do not scale past a handful of tables, because every new table needs someone to remember. With ABAC the rule is attached to the classification, so tagging a column is all a producer has to do. I keep the functions simple, deterministic SQL in a governance schema.",
ex:[{t:'Row filter and column mask on one table',code:`
spark.sql("""
CREATE OR REPLACE FUNCTION main.gov.region_filter(region STRING) RETURNS BOOLEAN
RETURN is_account_group_member('global_admins') OR region = 'EMEA'""")
spark.sql("ALTER TABLE main.gold.sales SET ROW FILTER main.gov.region_filter ON (region)")

spark.sql("""
CREATE OR REPLACE FUNCTION main.gov.mask_email(email STRING) RETURNS STRING
RETURN CASE WHEN is_account_group_member('pii_readers') THEN email
            ELSE concat('***@', split_part(email, '@', 2)) END""")
spark.sql("ALTER TABLE main.gold.customers ALTER COLUMN email SET MASK main.gov.mask_email")`},
{t:'ABAC: one policy for every column tagged as email',code:`
spark.sql("ALTER TABLE main.gold.customers ALTER COLUMN email SET TAGS ('pii' = 'email')")
spark.sql("""
CREATE OR REPLACE FUNCTION main.gov.redact(v STRING) RETURNS STRING RETURN '[redacted]'""")
spark.sql("""
CREATE POLICY mask_pii_email ON CATALOG main
COMMENT 'Mask email columns for everyone except pii_readers'
COLUMN MASK main.gov.redact
TO \`account users\` EXCEPT \`pii_readers\`
FOR TABLES
MATCH COLUMNS hasTagValue('pii', 'email') AS c
ON COLUMN c""")`}],
traps:["Row filters and masks need standard access mode or serverless (or dedicated compute with fine-grained access control).","A table can have one row filter; a column can have one mask.","ABAC policies are inherited by child objects."]});
F({id:'pii-protection',title:'Pseudonymization, anonymization and PII pipelines',exam:'S6',
what:["Pseudonymization replaces identifiers with a stand-in that can be linked back with extra information (salted hash, token from a vault table). Anonymization removes the link for good (suppression, generalization into ranges, aggregation). Pseudonymized data is still personal data."],
flow:[['Raw PII in bronze','Restricted schema, short retention.'],['Detect and tag','Data classification or explicit tags.'],['Transform in silver','Hash or tokenize identifiers, generalize quasi-identifiers.'],['Mask at read','Column masks for anything still sensitive.'],['Analytics','Consumers work on pseudonymized or aggregated data.']],
table:{title:'Methods',head:['Method','Reversible','Example','Use'],rows:[
['Hashing with salt','No, but linkable','[[sha2(concat(salt, email), 256)]]','Join keys without exposing the value'],
['Tokenization','Yes, through a vault table','Random token per customer id','Need to re-identify under control'],
['Suppression','No','Drop or null the column','Field not needed'],
['Generalization','No','Age 37 becomes 30 to 39; zip to first 3 digits','Keep analytic value, reduce uniqueness']]},
when:["Any table that leaves the restricted zone."],avoid:["Unsalted hashes of low-entropy values such as phone numbers: they can be reversed by brute force."],
senior:"I separate identity from behavior early: one small, locked-down table maps real identifiers to tokens, and every other table carries only the token. A deletion request then touches one row in the mapping table and the rest of the lake is no longer linkable.",
ex:[{t:'Salted hash and generalization in a streaming silver table',code:`
from pyspark.sql import functions as F
salt = dbutils.secrets.get("privacy", "email_salt")
silver = (spark.readStream.table("main.bronze.signups")
    .withColumn("email_key", F.sha2(F.concat(F.lit(salt), F.lower("email")), 256))
    .withColumn("age_band", F.concat((F.floor(F.col("age") / 10) * 10).cast("string"), F.lit("s")))
    .withColumn("zip3", F.substring("zip", 1, 3))
    .drop("email", "age", "zip", "full_name"))`},
{t:'Tokenization with a vault table',code:`
from pyspark.sql import functions as F
new_ids = (spark.table("main.bronze.customers").select("customer_id").distinct()
    .join(spark.table("main.vault.customer_tokens"), "customer_id", "left_anti")
    .withColumn("token", F.expr("uuid()")))
new_ids.write.mode("append").saveAsTable("main.vault.customer_tokens")     # restricted schema

tokenized = (spark.table("main.bronze.orders")
    .join(spark.table("main.vault.customer_tokens"), "customer_id")
    .drop("customer_id"))`}],
traps:["Hashing is pseudonymization, not anonymization.","[[ai_mask]] and data classification help detect and redact PII in free text."]});
F({id:'gdpr-purge',title:'Data purging and right to erasure',major:true,exam:'S6',
what:["Deleting a row in Delta removes it from the current version only. Earlier versions, deletion vectors, change feed files and downstream copies still hold it until they are rewritten and vacuumed. A compliant purge covers all of them within the deadline."],
flow:[['Erasure request','Added to a control table of keys to delete.'],['DELETE in every layer','Bronze, silver and gold, driven by the control table.'],['REORG PURGE','Rewrites files that only hide rows behind deletion vectors.'],['VACUUM','After retention, removes old files so time travel cannot return the rows.'],['Verify and log','Record completion for audit.']],
when:["Any table holding personal data."],avoid:["Long retention settings on tables with personal data: they extend how long deleted rows physically exist."],
senior:"I design for deletion on day one: a consistent subject key in every table, short retention on PII tables, and a scheduled purge job that reads requests, deletes, purges and vacuums. Streams that read tables receiving deletes use [[skipChangeCommits]] or the change feed so the delete does not break them. Where the platform offers automatic row expiry (auto TTL), I use it for retention-based deletion.",
ex:[{t:'Delete across tables from a request list',code:`
keys = spark.table("main.privacy.erasure_requests").where("status = 'OPEN'").select("customer_id")
keys.createOrReplaceTempView("to_erase")
for t in ["main.bronze.customers", "main.silver.customers", "main.silver.orders"]:
    spark.sql(f"DELETE FROM {t} WHERE customer_id IN (SELECT customer_id FROM to_erase)")`},
{t:'Make the deletion physical',code:`
for t in ["main.bronze.customers", "main.silver.customers", "main.silver.orders"]:
    spark.sql(f"ALTER TABLE {t} SET TBLPROPERTIES ('delta.deletedFileRetentionDuration' = 'interval 7 days')")
    spark.sql(f"REORG TABLE {t} APPLY (PURGE)")
    spark.sql(f"VACUUM {t}")                 # removes files older than the retention`}],
traps:["After DELETE the data is still reachable by time travel until VACUUM removes the files.","With deletion vectors, run REORG PURGE before VACUUM or the row stays in the Parquet file.","Materialized views and streaming tables downstream must also be refreshed or cleaned."]});

{t:'Streaming progress metrics',code:`
from pyspark.sql.streaming import StreamingQueryListener
class Lag(StreamingQueryListener):
    def onQueryStarted(self, e): pass
    def onQueryTerminated(self, e): pass
    def onQueryProgress(self, e):
        p = e.progress
        print(p.name, p.batchId, p.numInputRows, p.inputRowsPerSecond, p.processedRowsPerSecond)
spark.streams.addListener(Lag())
# Ad hoc: query.lastProgress["durationMs"], query.lastProgress["stateOperators"]`},

databricks pipelines list-pipeline-events <pipeline-id>`}],

CREATE TABLE main.gold.fact_orders (
  order_id BIGINT, customer_sk BIGINT, store_sk BIGINT,

CLUSTER BY (order_date, customer_sk)

F({id:'dimensional-modeling',title:'Dimensional models, materialized views and metric views',major:true,exam:'S9',

from pyspark import pipelines as dp
from pyspark.sql import functions as F

@dp.materialized_view(name="gold_sales_by_store_day", cluster_by=["order_date"])
def gold_sales_by_store_day():
    f = spark.read.table("main.gold.fact_orders")
    s = spark.read.table("main.gold.dim_store")
    return (f.join(s, "store_sk").groupBy("order_date", "store_sk", "region")
        .agg(F.sum("amount").alias("revenue"), F.countDistinct("order_id").alias("orders")))`},

C('12-spark-engine','Spark engine');
F({id:'spark-architecture',title:'How Spark executes your code',major:true,
what:["Every Databricks workload, whether SQL, Python, a pipeline or ML training on tables, ends up as Spark (or Photon) work. The driver turns your DataFrame or SQL code into a plan. When an action runs, the plan becomes a job, the job splits into stages at each shuffle, and each stage runs one task per partition on the executors.",
"Transformations are lazy: [[filter]], [[select]] and [[join]] only build the plan. Actions such as [[count]], [[write]] and [[collect]] execute it. Catalyst optimizes the logical plan (pushes filters down, prunes columns). Adaptive Query Execution (AQE) re-plans at runtime using real sizes. Photon runs the physical operators in vectorized native code."],
flow:[['Your code','DataFrame, SQL or pipeline definition.'],['Logical plan','Catalyst resolves names and applies rules such as predicate pushdown.'],['Physical plan','Join strategies and exchanges (shuffles) are chosen.'],['Job, stages, tasks','An action creates a job; each shuffle boundary starts a new stage; one task per partition.'],['AQE','After each stage, real statistics can coalesce partitions, switch to a broadcast join or split skew.']],
table:{title:'Narrow and wide transformations',head:['Kind','Examples','Shuffle?','Cost'],rows:[
['Narrow','[[select]], [[filter]], [[withColumn]], [[union]], map-side work','No','Cheap, pipelined in one stage'],
['Wide','[[groupBy]], [[join]] (non-broadcast), [[distinct]], [[orderBy]], [[repartition]], window with partitionBy','Yes','Network, disk, a new stage']]},
when:["Use this mental model whenever you read a Spark UI, a query profile or an explain plan."],
avoid:["Calling actions in a loop ([[count]] for every step). Each one runs the whole plan again."],
senior:"Most performance work is reducing shuffles and the bytes in each one. Read less (filters and clustering), shuffle less (broadcast small tables, aggregate before joining), and let AQE handle partition counts. I almost never set [[spark.sql.shuffle.partitions]] by hand any more.",
ex:[{t:'Lazy plan, one action, read the plan',code:`
from pyspark.sql import functions as F
orders = spark.table("main.silver.orders")             # nothing runs yet
big = (orders.where("order_date >= '2026-10-01'")       # narrow
    .groupBy("customer_id")                              # wide: shuffle
    .agg(F.sum("amount").alias("spend")))
big.explain("formatted")       # Exchange = shuffle; PushedFilters = file skipping
big.write.mode("overwrite").saveAsTable("main.gold.spend_oct")   # the action`},
{t:'repartition, coalesce and AQE',code:`
spark.conf.set("spark.sql.adaptive.enabled", "true")                 # default on Databricks
spark.conf.set("spark.sql.adaptive.coalescePartitions.enabled", "true")

wide = df.repartition(200, "customer_id")   # full shuffle, even distribution by key
narrow = df.coalesce(8)                     # merges partitions, no shuffle, can be uneven
print(df.rdd.getNumPartitions(), wide.rdd.getNumPartitions(), narrow.rdd.getNumPartitions())`}],
traps:["[[coalesce]] can only reduce partitions and avoids a shuffle; [[repartition]] can go up or down and always shuffles.","[[collect]] and [[toPandas]] pull the whole result to the driver.","A cached DataFrame is materialized only when an action runs."]});
F({id:'databricks-connect',parent:'spark-architecture',title:'Spark Connect and Databricks Connect',
what:["Spark Connect separates the client from the cluster: your code builds a plan locally and sends it over gRPC to remote compute. Databricks Connect is the Databricks client built on it, so you can run PySpark from your IDE, a script or a test suite against serverless or a cluster, with breakpoints and local tooling."],
flow:[['IDE or script','Your Python process with databricks-connect installed.'],['Build plan','DataFrame calls create an unresolved plan locally.'],['Send','The plan goes to Databricks compute, authenticated with your profile.'],['Execute remotely','Data never leaves Databricks unless you collect it.'],['Results','Only collected results come back.']],
when:["Local development and debugging in VS Code or PyCharm.","Integration tests in CI against real compute.","Python applications that need Spark without running on a cluster."],
avoid:["Code that relies on the RDD API or [[sparkContext]]: those are not available through Spark Connect.","Moving large data to the client."],
senior:"Databricks Connect is how I test the transformations in my package: the same functions run in pytest locally and in the job. Standard access mode and serverless also run on Spark Connect, so code that avoids RDDs works everywhere.",
ex:[{t:'Session against serverless or a profile',code:`
from databricks.connect import DatabricksSession

spark = DatabricksSession.builder.serverless().getOrCreate()
# or: DatabricksSession.builder.profile("dev").clusterId("0123-456789-abc").getOrCreate()

df = spark.table("samples.nyctaxi.trips").where("trip_distance > 10")
print(df.count())`},
{t:'pytest fixture shared by every test',code:`
# tests/conftest.py
import pytest
from databricks.connect import DatabricksSession

@pytest.fixture(scope="session")
def spark():
    return DatabricksSession.builder.serverless().getOrCreate()`}],
traps:["The Databricks Connect version should match the runtime major and minor version you target.","[[spark.sparkContext]] and RDD operations fail under Spark Connect."]});
F({id:'pandas-on-spark',parent:'spark-architecture',title:'pandas API on Spark and pandas functions',
what:["The pandas API on Spark ([[pyspark.pandas]]) gives a pandas-like interface that runs distributed. For custom per-group or per-batch Python logic, [[applyInPandas]] and [[mapInPandas]] hand each group or batch to your function as a real pandas DataFrame."],
flow:[['Distributed data','A Spark DataFrame.'],['Split','By group key or into Arrow batches.'],['Your pandas code','Runs on executors, one group or batch at a time.'],['Recombine','Results form a new Spark DataFrame.']],
when:["Porting pandas code to large data with minimal rewrite.","Per-group work such as fitting a model per store."],
avoid:["Code that depends on row order or a global index on huge data.","Groups larger than executor memory."],
senior:"I use pyspark.pandas for migration, then rewrite hot paths in plain DataFrame code. applyInPandas is the workhorse for many-models training: one model per key, in parallel, with no driver bottleneck.",
ex:[{t:'pandas syntax, distributed',code:`
import pyspark.pandas as ps
psdf = ps.read_table("main.silver.orders")
summary = (psdf[psdf["amount"] > 0]
    .groupby("country")["amount"].agg(["sum", "mean", "count"])
    .sort_values("sum", ascending=False))
summary.head(10)
sdf = psdf.to_spark()      # back to a Spark DataFrame`},
{t:'One forecast per store with applyInPandas',code:`
import pandas as pd
def fit_store(pdf: pd.DataFrame) -> pd.DataFrame:
    pdf = pdf.sort_values("day")
    trend = pdf["sales"].rolling(7, min_periods=1).mean().iloc[-1]
    return pd.DataFrame({"store_id": [pdf["store_id"].iloc[0]], "next_day_forecast": [trend]})

forecasts = (spark.table("main.silver.daily_sales")
    .groupBy("store_id")
    .applyInPandas(fit_store, schema="store_id string, next_day_forecast double"))`}],
traps:["applyInPandas loads a whole group into memory on one executor.","pyspark.pandas default index can trigger expensive operations; set a distributed index type for large data."]});

C('13-delta-advanced','Delta and Iceberg features');
F({id:'table-constraints',title:'Constraints, generated, identity and default columns',major:true,
what:["Delta enforces NOT NULL and CHECK constraints on every write. Generated columns compute their value from other columns. Identity columns assign unique increasing numbers, useful as surrogate keys. Default values fill columns that a write leaves out. Primary and foreign keys are informational: documented and used by tools, not enforced."],
flow:[['Write arrives','INSERT, MERGE, append or streaming batch.'],['Defaults and generated values','Filled in by Delta.'],['Identity','A new unique value per inserted row.'],['Constraint check','Any violating row fails the whole transaction.'],['Commit','Only valid data becomes visible.']],
when:["Rules that must never be broken, enforced at the storage layer regardless of which tool writes.","Surrogate keys for dimensions."],
avoid:["Using CHECK constraints for soft quality rules: one bad row fails the whole write. Use pipeline expectations for those."],
senior:"Constraints are my last line of defense, not my quality strategy. I put a handful of hard invariants on gold tables (non-null keys, non-negative amounts) and declare primary and foreign keys so BI tools and the optimizer understand the model. Identity columns are unique but not gap-free, so never use them as a business sequence.",
ex:[{t:'Create a dimension with identity, generated and default columns',code:`
spark.sql("""
CREATE TABLE main.gold.dim_customer (
  customer_sk  BIGINT GENERATED ALWAYS AS IDENTITY,
  customer_id  STRING NOT NULL,
  signup_ts    TIMESTAMP,
  signup_date  DATE GENERATED ALWAYS AS (CAST(signup_ts AS DATE)),
  status       STRING DEFAULT 'active',
  CONSTRAINT dim_customer_pk PRIMARY KEY (customer_sk)
) TBLPROPERTIES ('delta.feature.allowColumnDefaults' = 'supported')""")`},
{t:'Add a CHECK constraint and a foreign key',code:`
spark.sql("ALTER TABLE main.gold.fact_orders ADD CONSTRAINT positive_amount CHECK (amount >= 0)")
spark.sql("""
ALTER TABLE main.gold.fact_orders ADD CONSTRAINT fk_customer
FOREIGN KEY (customer_sk) REFERENCES main.gold.dim_customer""")
spark.sql("SHOW TBLPROPERTIES main.gold.fact_orders").where("key LIKE 'delta.constraints%'").show(truncate=False)`}],
traps:["Adding a CHECK constraint fails if existing rows violate it.","Primary and foreign keys in Unity Catalog are not enforced.","With GENERATED ALWAYS AS IDENTITY you cannot insert your own values."]});
F({id:'column-mapping-type-widening',parent:'table-constraints',title:'Renames, drops and type widening',
what:["Parquet files identify columns by name, so renaming used to mean rewriting data. Column mapping gives each column a stable internal id, which lets you rename and drop columns as metadata changes. Type widening lets you change a column to a wider type (int to bigint, float to double, decimal precision up) without rewriting files."],
flow:[['Enable feature','Column mapping mode name, or type widening.'],['ALTER TABLE','Rename, drop or widen.'],['Metadata commit','Schema changes; files stay.'],['Readers','Map old files to the new schema.']],
when:["Cleaning up badly named source columns.","A counter outgrows INT."],
avoid:["Readers on old Delta clients: these features upgrade the table protocol."],
senior:"Column mapping changes how a streaming reader sees the table: a rename or drop is a non-additive schema change, so downstream streams need a schema tracking location or a restart. I plan these changes like a migration.",
ex:[{t:'Rename and drop without rewriting data',code:`
spark.sql("ALTER TABLE main.silver.orders SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name')")
spark.sql("ALTER TABLE main.silver.orders RENAME COLUMN cust_no TO customer_id")
spark.sql("ALTER TABLE main.silver.orders DROP COLUMN legacy_flag")`},
{t:'Widen a column type',code:`
spark.sql("ALTER TABLE main.silver.events SET TBLPROPERTIES ('delta.enableTypeWidening' = 'true')")
spark.sql("ALTER TABLE main.silver.events ALTER COLUMN view_count TYPE BIGINT")
# Streaming readers of a renamed/dropped column table:
s = (spark.readStream.option("schemaTrackingLocation", "/Volumes/main/ops/chk/events_schema")
    .table("main.silver.orders"))`}],
traps:["Dropping a column with column mapping does not remove its data from files until they are rewritten.","Narrowing types (bigint to int) is never allowed in place."]});
F({id:'iceberg-uniform',title:'Iceberg, UniForm and open access',major:true,
what:["Unity Catalog stores tables as Delta or Apache Iceberg. Managed Iceberg tables are first-class: predictive optimization, liquid clustering and governance apply. UniForm writes Iceberg metadata for a Delta table so Iceberg readers see the same files. External engines (Spark, Trino, Snowflake, DuckDB) read and write through the Unity Catalog Iceberg REST catalog with credential vending."],
flow:[['Table in UC','Managed Delta or managed Iceberg.'],['Metadata','Delta log, Iceberg metadata, or both with UniForm.'],['REST catalog','External engines discover tables through Unity Catalog.'],['Credential vending','UC gives short-lived storage credentials scoped to the table.'],['Governance','Same grants apply in and outside Databricks.']],
table:{title:'Choosing a format',head:['Need','Choose'],rows:[
['Databricks-centric workloads','Managed Delta'],
['Other engines must read the same table','Managed Delta with UniForm, or managed Iceberg'],
['Other engines must also write','Managed Iceberg through the Iceberg REST catalog'],
['Tables already managed by an external Iceberg catalog','Catalog federation, query them in place']]},
when:["Multi-engine architectures where you want one copy of the data."],
avoid:["Copying data into a second format with a nightly job."],
senior:"Format wars are over in practice: pick Delta for Databricks-heavy work, flip on UniForm when someone else needs to read it, and choose managed Iceberg when another engine must write. The governance layer is the part that matters, and it is the same either way.",
ex:[{t:'Managed Iceberg table and a UniForm Delta table',code:`
spark.sql("""
CREATE TABLE main.gold.orders_ice (order_id BIGINT, amount DECIMAL(18,2), order_date DATE)
USING ICEBERG CLUSTER BY (order_date)""")

spark.sql("""
ALTER TABLE main.gold.fact_orders SET TBLPROPERTIES (
  'delta.enableIcebergCompatV2' = 'true',
  'delta.universalFormat.enabledFormats' = 'iceberg')""")`},
{t:'External Spark reading through the Unity Catalog Iceberg REST catalog',code:`
# Runs outside Databricks (open-source Spark with the Iceberg runtime jar)
from pyspark.sql import SparkSession
spark = (SparkSession.builder
    .config("spark.sql.catalog.uc", "org.apache.iceberg.spark.SparkCatalog")
    .config("spark.sql.catalog.uc.type", "rest")
    .config("spark.sql.catalog.uc.uri", "https://<workspace-host>/api/2.1/unity-catalog/iceberg-rest")
    .config("spark.sql.catalog.uc.warehouse", "main")
    .config("spark.sql.catalog.uc.token", "<oauth-token>")
    .getOrCreate())
spark.table("uc.gold.orders_ice").show()`}],
traps:["UniForm needs column mapping and disables deletion vectors on older protocol versions; check the requirements before enabling.","External access requires the EXTERNAL USE SCHEMA privilege in addition to SELECT."]});

what:["Notebooks mix Python, SQL, Scala and Markdown cells, with real-time co-editing, comments, version history, Git folder integration and the Databricks Assistant. [[dbutils]] adds helpers for files, widgets (parameters), secrets, job task values and calling other notebooks."],

{t:'Run child notebooks in parallel and collect results',code:`
from concurrent.futures import ThreadPoolExecutor
regions = ["emea", "amer", "apac"]

def run(region):
    return dbutils.notebook.run("./load_region", 3600, {"region": region, "run_date": run_date})

F({id:'secrets',parent:'notebooks-dbutils',title:'Secrets',
what:["Secret scopes store credentials such as API keys and database passwords. Code reads them at runtime with [[dbutils.secrets.get]] or the SQL [[secret()]] function, and their values are redacted in notebook output. Access is controlled with ACLs on each scope."],
flow:[['Admin creates scope','Databricks-backed or backed by a cloud key vault.'],['Put secret','With the CLI or API.'],['Grant READ','To the group or service principal that needs it.'],['Read at runtime','Value is used, never printed.']],
when:["Any credential used by code or connections."],
avoid:["Hard-coding credentials in notebooks, job parameters or bundle files.","Secrets for Databricks-to-Databricks auth: use OAuth service principals instead."],
senior:"Prefer identities to secrets: Unity Catalog storage credentials, service credentials and connections remove most of the secrets people used to need. What is left goes in one scope per application with READ granted to its service principal only.",
ex:[{t:'Create a scope and grant access with the CLI',lang:'bash',code:`
databricks secrets create-scope crm
databricks secrets put-secret crm api_key --string-value "$CRM_API_KEY"
databricks secrets put-acl crm sp-orders-pipeline READ
databricks secrets list-secrets crm`},
{t:'Read secrets in Python and SQL',code:`
import requests
key = dbutils.secrets.get(scope="crm", key="api_key")
r = requests.get("https://api.crm.example/v1/accounts", headers={"Authorization": "Bearer " + key}, timeout=30)
print(key)      # prints [REDACTED]

spark.sql("SELECT secret('crm', 'api_key') IS NOT NULL AS has_key").show()`}],
traps:["Redaction only hides the literal value in output; transforming it (for example reversing it) can leak it. Treat code with secret access as sensitive.","Secret scope ACLs are MANAGE, WRITE and READ."]});
F({id:'automation-interfaces',title:'REST API, SDKs, CLI and Terraform',major:true,
what:["Everything in the UI is backed by the REST API. The Databricks SDKs (Python, Java, Go) and the CLI wrap it with authentication, pagination and waiters. Declarative Automation Bundles deploy projects. Terraform manages infrastructure such as workspaces, networking, metastores and account-level identity."],
flow:[['Pick the job','Ad hoc admin task, application code, project deployment or infrastructure.'],['Authenticate','Unified auth: profiles, environment variables, OAuth.'],['Call','CLI command, SDK method or declarative config.'],['Wait and verify','Waiters for long operations, then check state.']],
table:{title:'Which interface',head:['Task','Choose'],rows:[
['One-off admin or scripting from a shell','CLI'],
['Logic inside an app, notebook or service','Python SDK'],
['Deploy jobs, pipelines, dashboards of a project','Declarative Automation Bundles'],
['Workspaces, networking, metastore, account groups','Terraform provider'],
['Something no wrapper covers yet','REST API (or [[w.api_client.do]])']]},
when:["Anything you do twice."],avoid:["Two tools managing the same resource: Terraform and bundles fighting over a job causes drift."],
senior:"My split: Terraform owns the platform (workspaces, network, catalogs, groups), bundles own the data products (jobs, pipelines, dashboards), and the SDK is for glue code and operations. One owner per resource, always.",
ex:[{t:'Python SDK: create a job and run it',code:`
from databricks.sdk import WorkspaceClient
from databricks.sdk.service import jobs
w = WorkspaceClient()        # reads profile or env vars

C('15-databricks-sql-bi','Databricks SQL and BI');
F({id:'sql-warehouses',title:'SQL warehouses',major:true,
what:["A SQL warehouse is compute for SQL: the SQL editor, dashboards, Genie, alerts, BI tools over JDBC or ODBC, and SQL tasks in jobs. Serverless warehouses start in seconds, scale out by adding clusters when queries queue, and use Photon and intelligent workload management."],
flow:[['Query arrives','From a tool, dashboard or API.'],['Queue and route','Workload management schedules it.'],['Scale','More clusters are added under concurrency, up to the maximum.'],['Execute','Photon, disk cache and result cache.'],['Auto stop','The warehouse stops after idle minutes.']],
table:{title:'Types',head:['Type','Start time','Choose when'],rows:[
['Serverless','Seconds','Default: BI, ad hoc SQL, dashboards, Genie'],
['Pro','Minutes','Serverless not available, or features that need your own network'],
['Classic','Minutes','Legacy; few reasons to pick it now']]},
when:["Any SQL-only workload, especially many concurrent users."],avoid:["Python or ML workloads: use serverless notebooks and jobs."],
senior:"Size for the heaviest single query (the T-shirt size), scale for concurrency (max clusters). I separate warehouses by workload, such as BI, ad hoc and ETL, so one runaway query cannot slow the CEO dashboard, and I tag each one for cost reporting.",
ex:[{t:'Create a serverless warehouse with the SDK',code:`
from databricks.sdk import WorkspaceClient
from databricks.sdk.service.sql import CreateWarehouseRequestWarehouseType, EndpointTags, EndpointTagPair
w = WorkspaceClient()
wh = w.warehouses.create(
    name="bi-serverless", cluster_size="Small",

    enable_serverless_compute=True,
    warehouse_type=CreateWarehouseRequestWarehouseType.PRO,
    tags=EndpointTags(custom_tags=[EndpointTagPair(key="team", value="bi")])).result()
print(wh.id)`},
{t:'Run SQL from any app with the Statement Execution API',code:`
resp = w.statement_execution.execute_statement(
    warehouse_id=wh.id,
    statement="SELECT region, SUM(amount) AS revenue FROM main.gold.fact_orders WHERE order_date >= :d GROUP BY region",
    parameters=[{"name": "d", "value": "2026-11-01", "type": "DATE"}],
    wait_timeout="30s")
print(resp.status.state, resp.result.data_array[:5])`}],

F({id:'sql-scripting-params',parent:'sql-warehouses',title:'Parameterized SQL and SQL scripting',
what:["Named parameter markers ([[:name]]) keep values out of the SQL text, which prevents injection and enables plan reuse. [[IDENTIFIER()]] safely parameterizes table and column names. SQL scripting adds variables, IF, loops and exception handlers so procedural logic can run as SQL."],
flow:[['Parameters','Values bound at execution.'],['IDENTIFIER','Turns a string parameter into a validated object name.'],['Script block','BEGIN ... END with DECLARE, IF, FOR, WHILE.'],['Run','From the SQL editor, a notebook, a job SQL task or the API.']],
when:["Any SQL built from user input.","SQL-first teams that need loops or conditional logic without Python."],
avoid:["String formatting values into SQL with f-strings."],
senior:"I treat an f-string with a user value inside [[spark.sql]] as a security bug in review. Named parameters plus IDENTIFIER cover every case I have needed.",
ex:[{t:'Safe parameters from Python',code:`
tbl = "main.gold.fact_orders"
df = spark.sql(
    "SELECT region, SUM(amount) AS revenue FROM IDENTIFIER(:tbl) WHERE order_date >= :d GROUP BY region",
    args={"tbl": tbl, "d": "2026-11-01"})`},
{t:'SQL script with a loop and a condition',lang:'sql',code:`
BEGIN
  DECLARE total BIGINT DEFAULT 0;
  FOR t AS SELECT table_name FROM main.information_schema.tables WHERE table_schema = 'bronze' DO
    EXECUTE IMMEDIATE 'OPTIMIZE main.bronze.' || t.table_name;
    SET total = total + 1;
  END FOR;
  IF total = 0 THEN
    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'No bronze tables found';
  END IF;
  SELECT total AS optimized_tables;
END;`}],
traps:["Parameter markers stand for values, not identifiers; use IDENTIFIER for names.","Positional ([[?]]) and named markers cannot be mixed in one statement."]});
F({id:'aibi-dashboards',title:'AI/BI dashboards',

flow:[['Datasets','SQL queries or metric views.'],['Widgets','Charts, counters, tables, filters.'],['Draft','Edit and preview.'],['Publish','With the publisher\'s credentials or each viewer\'s own.'],['Share and schedule','Users, groups, email subscriptions, embedding.']],
when:["Operational and executive dashboards that live next to the data and governance.","Teams that want dashboards versioned and deployed with the rest of the project."],
avoid:["Pixel-perfect paginated reporting: use a dedicated BI tool on the same warehouse."],

resources:

F({id:'agents-genai',title:'Agents, Agent Bricks and MLflow 3 evaluation',major:true,
what:["Agent Bricks builds common agents from a description and your data with little code: knowledge assistants over documents, information extraction, and supervisors that route between agents and Genie. For custom agents, you write code with any framework, log it with MLflow, and deploy it to Model Serving. MLflow 3 traces every step and evaluates quality with built-in LLM judges and your own scorers, offline and in production."],
flow:[['Build','Agent Bricks, or code with LangGraph, OpenAI SDK or plain Python and tools (UC functions, Vector Search, Genie).'],['Trace','MLflow captures each LLM call, tool call and retrieval.'],['Evaluate','mlflow.genai.evaluate with judges such as Correctness, Safety, RetrievalGroundedness.'],['Deploy','Register in Unity Catalog, serve behind AI Gateway, review app for experts.'],['Monitor','The same scorers run on sampled production traces.']],
when:["Agent Bricks: a standard pattern and you want a good result fast.","Custom code: unusual tools, control flow or integration needs."],
avoid:["Shipping an agent without an evaluation set. Without one you cannot tell whether a prompt change helped."],
senior:"Evaluation is the product. I start with 30 to 50 real questions with expected answers from domain experts, run them on every change, and add every production failure to the set. Tracing turns 'the bot was wrong' into 'retrieval missed the runbook chunk', which is a fix you can actually make.",
ex:[{t:'Trace an app with autologging and a decorator',code:`
import mlflow
from databricks.sdk import WorkspaceClient
mlflow.openai.autolog()
mlflow.set_experiment("/Shared/support-agent")
client = WorkspaceClient().serving_endpoints.get_open_ai_client()

@mlflow.trace
def answer(question: str) -> str:
    docs = index.similarity_search(query_text=question, columns=["chunk_text"], num_results=3)
    context = "\\n".join(r[0] for r in docs["result"]["data_array"])
    out = client.chat.completions.create(model="databricks-claude-sonnet-4",
        messages=[{"role": "system", "content": "Answer only from the context."},
                  {"role": "user", "content": context + "\\n\\nQuestion: " + question}])
    return out.choices[0].message.content`},
{t:'Evaluate with built-in judges and a custom scorer',code:`
import mlflow
from mlflow.genai.scorers import Correctness, RelevanceToQuery, Safety, scorer

@scorer
def short_enough(outputs) -> bool:
    return len(outputs.split()) <= 120

eval_data = [
    {"inputs": {"question": "How do I rotate a service principal secret?"},
     "expectations": {"expected_response": "Create a new OAuth secret, update consumers, then delete the old one."}},
]
results = mlflow.genai.evaluate(data=eval_data, predict_fn=answer,
                                scorers=[Correctness(), RelevanceToQuery(), Safety(), short_enough])`}],
traps:["MLflow 3 evaluation runs only the scorers you list; nothing runs by default.","predict_fn receives the keys of inputs as keyword arguments."]});

from pyspark.ml import Pipeline
from pyspark.ml.feature import StringIndexer, VectorAssembler
from pyspark.ml.classification import GBTClassifier

mlflow.pyspark.ml.autolog()

df = spark.table("main.ml.churn_training")

    StringIndexer(inputCol="plan", outputCol="plan_idx", handleInvalid="keep"),
    VectorAssembler(inputCols=["plan_idx", "tenure", "monthly_spend"], outputCol="features"),
    GBTClassifier(labelCol="churned", featuresCol="features", maxIter=50)])
train, test = df.randomSplit([0.8, 0.2], seed=7)
model = pipe.fit(train)
model.transform(test).select("churned", "prediction").show(5)`},

from pyspark.ml.torch.distributor import TorchDistributor

def train_fn(epochs: int):
    import torch, torch.distributed as dist

    for _ in range(epochs):

TorchDistributor(num_processes=8, local_mode=False, use_gpu=True).run(train_fn, 5)`}],

traps:["One metastore per region; workspaces in that region attach to it.","Workspace admins are not automatically metastore admins."]});
F({id:'storage-access',parent:'account-identity',title:'Storage credentials, external locations and volumes',
what:["A storage credential wraps a cloud identity (IAM role, managed identity, service account). An external location pairs a credential with a storage path and is what you grant on. Volumes govern non-tabular files (CSV drops, images, PDFs, model artifacts) under Unity Catalog with paths like [[/Volumes/catalog/schema/volume]]."],
flow:[['Cloud identity','Role or managed identity with access to the bucket.'],['Storage credential','Registered in Unity Catalog.'],['External location','Credential plus path, with file events optional.'],['Grants','READ FILES, WRITE FILES, CREATE EXTERNAL TABLE or VOLUME.'],['Use','External tables, external volumes, Auto Loader sources.']],
when:["Landing zones and any file access."],avoid:["Instance profiles, DBFS mounts and keys in Spark configs: legacy patterns that bypass governance."],
senior:"Mounts are the most common legacy pattern I remove in migrations. Volumes give the same convenient paths with permissions and audit.",
ex:[{t:'External location and grants',code:`
spark.sql("""
CREATE EXTERNAL LOCATION IF NOT EXISTS landing_zone
URL 's3://acme-landing/'
WITH (STORAGE CREDENTIAL acme_landing_role)
COMMENT 'Raw drops from partners'""")
spark.sql("GRANT READ FILES ON EXTERNAL LOCATION landing_zone TO \`data_engineers\`")`},
{t:'Managed and external volumes',code:`

pdfs = spark.read.format("binaryFile").load("/Volumes/main/landing/partner/contracts/*.pdf")`}],
traps:["External locations cannot overlap each other or managed storage paths.","Volumes hold files; you cannot query a volume as a table without reading the files."]});
F({id:'network-security',title:'Networking and workspace security',
what:["Security controls sit at several layers: private connectivity (Private Link) for front end and back end, IP access lists, serverless egress control with network policies, customer-managed keys for encryption, the compliance security profile for regulated workloads, and audit logs in system tables."],
flow:[['User or client','Through SSO, from allowed networks.'],['Front end','Private Link or IP access lists.'],['Compute','Classic in your VPC or VNet; serverless in the Databricks account with network connectivity configs.'],['Egress','Network policies restrict outbound destinations.'],['Data','Encrypted, optionally with your keys; access audited.']],
when:["Any production or regulated deployment."],avoid:["Open public endpoints and unrestricted serverless egress for sensitive data."],

from databricks.sdk import WorkspaceClient

w = WorkspaceClient()

{t:'Audit sign-ins and permission changes',code:`

  AND (action_name LIKE '%login%' OR action_name = 'updatePermissions')

F({id:'hms-to-uc',title:'Migrating from Hive metastore to Unity Catalog',
what:["Older workspaces keep tables in the workspace-local Hive metastore. Moving to Unity Catalog unlocks serverless, lineage, ABAC, sharing and predictive optimization. Options: SYNC upgrades external tables in place, CLONE or CTAS copies managed tables, HMS federation exposes the legacy metastore in Unity Catalog during a gradual move, and the UCX tool from Databricks Labs automates assessment and migration."],
flow:[['Assess','UCX inventory: tables, mounts, jobs, incompatible code.'],['Set up UC','Metastore, credentials, external locations, groups.'],['Move tables','SYNC external tables; DEEP CLONE or CTAS managed ones.'],['Repoint code','Three-level names, volumes instead of mounts.'],['Switch and lock','Run jobs on UC-enabled compute; make HMS read-only.']],
when:["Any workspace still running on the Hive metastore."],avoid:["A big-bang cutover without an inventory of jobs and mounts."],

# Shell, on your machine:

const byId={};FEATS.forEach((f,i)=>{byId[f.id]=f;f.i=i;});
FEATS.forEach(f=>{const p=f.parent?byId[f.parent]:null;f.path=f.cat+'/'+(p?p.id+'/':'')+f.id+'/README.md';});
let done={};try{done=JSON.parse(localStorage.getItem('dbx-done')||'{}');}catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<code>$1</code>');
const KW={python:/\b(from|import|def|return|if|else|elif|for|in|while|with|as|lambda|None|True|False|and|or|not|class|try|except|yield|is)\b/,
 sql:/\b(SELECT|FROM|WHERE|CREATE|OR|REPLACE|REFRESH|TABLE|VIEW|STREAMING|MATERIALIZED|AS|INTO|MERGE|USING|ON|WHEN|MATCHED|NOT|THEN|UPDATE|SET|INSERT|DELETE|VALUES|GROUP|BY|ORDER|ALTER|GRANT|REVOKE|TO|CLUSTER|AUTO|OPTIMIZE|VACUUM|AND|WITH|FLOW|CDC|KEYS|SEQUENCE|STORED|SCD|TYPE|APPLY|COLUMNS|EXCEPT|CONSTRAINT|EXPECT|VIOLATION|DROP|ROW|FAIL|FUNCTION|RETURNS|RETURN|LANGUAGE|POLICY|FILTER|MASK|COLUMN|FOR|TABLES|MATCH|CATALOG|SCHEMA|SHARE|RECIPIENT|CONNECTION|FOREIGN|OPTIONS|COPY|FILEFORMAT|FORMAT_OPTIONS|COPY_OPTIONS|CASE|ELSE|END|JOIN|LEFT|OVER|PARTITION|ADD|USE|ALL|PRIVILEGES|TAGS|COMMENT|IS|NULL|REORG|PURGE|RETAIN|HOURS|DESCRIBE|HISTORY|RESTORE|VERSION|OF|CLONE|SHALLOW|DEEP|TBLPROPERTIES|METRICS|YAML|MEASURE|HAVING|QUALIFY|LIMIT|DISTINCT|UNION)\b/};
function hl(code,lang){
  if(lang==='yaml'||lang==='bash'){return esc(code).replace(/(#.*)$/gm,'<span class="c">$1</span>').replace(/^(\s*-?\s*)([\w.\-]+)(:)/gm,'$1<span class="k">$2</span>$3');}
  const com=lang==='sql'?'--.*$':'#.*$';
  const re=new RegExp('('+com+')|("""[\\s\\S]*?"""|\'[^\'\\n]*\'|"[^"\\n]*")|([A-Za-z_][A-Za-z0-9_]*)','gm');
  let out='',last=0,m;
  while((m=re.exec(code))){out+=esc(code.slice(last,m.index));
    if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';
    else out+=(KW[lang]&&new RegExp('^'+KW[lang].source.slice(2,-2)+'$').test(m[3]))?'<span class="k">'+m[3]+'</span>':m[3];
    last=re.lastIndex;}
  return out+esc(code.slice(last));
}
const nav=document.getElementById('nav'),page=document.getElementById('page');
function buildNav(){
  let h='';
  CATS.forEach(c=>{
    const fs=FEATS.filter(f=>f.cat===c.dir);
    h+='<details open data-cat="'+c.dir+'"><summary>'+c.dir+'/</summary>';
    fs.forEach(f=>{h+='<a href="#'+f.id+'" data-id="'+f.id+'" class="'+(f.parent?'sub ':'')+(done[f.id]?'done':'')+'"><span class="dot"></span><span>'+esc(f.title)+'</span>'+(f.major?'<span class="mj">major</span>':'')+'</a>';});
    h+='</details>';
  });
  nav.innerHTML=h;progress();
}
function progress(){const n=FEATS.length,d=FEATS.filter(f=>done[f.id]).length;
  document.getElementById('count').textContent=d+' of '+n+' pages studied';
  document.getElementById('pbar').style.width=(100*d/n)+'%';}
let timer=null;
function render(){
  const id=(location.hash||'').slice(1);const f=byId[id]||FEATS[0];
  clearInterval(timer);
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===f.id));
  let h='<div class="crumb">'+esc(f.path)+'</div><h1>'+esc(f.title)+'</h1><div class="badges">';
  if(f.major)h+='<span class="badge mj">Major feature</span>';
  if(f.exam)h+='<span class="badge">Exam: '+esc(f.exam)+'</span>';
  if(f.since)h+='<span class="badge">'+esc(f.since)+'</span>';
  h+='</div>';
  (f.what||[]).forEach(p=>h+='<p>'+md(p)+'</p>');
  if(f.flow){h+='<h2>How it flows</h2><div class="flow run" id="flow"><div class="track">';
    f.flow.forEach((n,i)=>{if(i)h+='<div class="edge" data-e="'+i+'"><i></i></div>';
      h+='<button type="button" class="node" data-n="'+i+'"><small>step '+(i+1)+'</small><b>'+md(n[0])+'</b></button>';});
    h+='</div><div class="cap"><p id="cap"></p><button type="button" id="pp">Pause</button></div></div>';}
  if(f.when||f.avoid){h+='<h2>When to choose it</h2><div class="cols">';
    if(f.when)h+='<div class="card yes"><h3>Choose it when</h3><ul>'+f.when.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul></div>';
    if(f.avoid)h+='<div class="card no"><h3>Pick something else when</h3><ul>'+f.avoid.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul></div>';
    h+='</div>';}
  if(f.table){h+='<h2>'+esc(f.table.title||'Comparison')+'</h2><div class="tw"><table><thead><tr>'+f.table.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
    f.table.rows.map(r=>'<tr>'+r.map(x=>'<td>'+(typeof x==='number'?'<div style="display:flex;gap:8px;align-items:center"><span>'+x+'%</span><div class="bar" style="width:'+x*5+'px"></div></div>':md(x))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
  if(f.senior)h+='<h2>Senior engineer verdict</h2><div class="senior"><p>'+md(f.senior)+'</p></div>';
  if(f.ex){h+='<h2>Examples</h2>';f.ex.forEach((e,i)=>{h+='<div class="ex"><header><div>'+(i+1)+'. '+esc(e.t)+'<span>'+esc(e.lang||'python')+'</span></div><button type="button" data-copy="'+i+'">Copy</button></header><pre>'+hl(e.code.trim(),e.lang||'python')+'</pre></div>';});}
  if(f.traps)h+='<h2>Exam traps</h2><div class="traps"><ul>'+f.traps.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul></div>';
  const prev=FEATS[f.i-1],next=FEATS[f.i+1];
  h+='<div class="foot">'+(prev?'<a href="#'+prev.id+'">← '+esc(prev.title)+'</a>':'<span></span>')+
    '<button type="button" id="mark" class="'+(done[f.id]?'done':'')+'">'+(done[f.id]?'Studied ✓ (undo)':'Mark as studied')+'</button>'+
    (next?'<a href="#'+next.id+'">'+esc(next.title)+' →</a>':'<span></span>')+'</div>';
  page.innerHTML=h;document.getElementById('main').scrollTop=0;document.getElementById('side').classList.remove('open');
  if(f.flow){let k=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches;const fl=document.getElementById('flow'),cap=document.getElementById('cap'),pp=document.getElementById('pp');
    const show=i=>{k=i;fl.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',+n.dataset.n===i));
      fl.querySelectorAll('.edge').forEach(e=>e.classList.toggle('live',+e.dataset.e===i));
      cap.innerHTML='<b>'+md(f.flow[i][0])+'.</b> '+md(f.flow[i][1]);};
    const tick=()=>show((k+1)%f.flow.length);
    const set=r=>{run=r;clearInterval(timer);if(r)timer=setInterval(tick,2600);pp.textContent=r?'Pause':'Play';fl.classList.toggle('run',r);};
    show(0);set(run);pp.onclick=()=>set(!run);
    fl.querySelectorAll('.node').forEach(n=>n.onclick=()=>{set(false);show(+n.dataset.n);});}
  page.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const c=f.ex[+b.dataset.copy].code.trim();
    try{navigator.clipboard.writeText(c).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{b.textContent='Select and copy';});}catch(e){b.textContent='Select and copy';}});
  document.getElementById('mark').onclick=()=>{if(done[f.id])delete done[f.id];else done[f.id]=1;
    try{localStorage.setItem('dbx-done',JSON.stringify(done));}catch(e){}
    nav.querySelector('a[data-id="'+f.id+'"]').classList.toggle('done',!!done[f.id]);progress();render();};
}
document.getElementById('q').addEventListener('input',e=>{const t=e.target.value.toLowerCase().trim();
  nav.querySelectorAll('a').forEach(a=>{const f=byId[a.dataset.id];
    const hay=(f.title+' '+f.id+' '+(f.what||[]).join(' ')+' '+(f.traps||[]).join(' ')).toLowerCase();
    a.style.display=!t||hay.includes(t)?'':'none';});
  nav.querySelectorAll('details').forEach(d=>{d.style.display=[...d.querySelectorAll('a')].some(a=>a.style.display!=='none')?'':'none';if(t)d.open=true;});});
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');
addEventListener('hashchange',render);buildNav();render();

</script>
